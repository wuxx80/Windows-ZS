<script src="../assets/js/admin-common.js"></script>
<script>
var pageTitles = {
  'dashboard.html': '控制台',
  'images.html': '镜像列表', 'image-sources.html': '镜像源', 'image-tags.html': '镜像标签',
  'tasks.html': '任务列表', 'task-templates.html': '任务模板',
  'unattend.html': '无人值守模板',
  'clients.html': '客户端管理', 'client-groups.html': '客户端分组', 'client-versions.html': '版本管理',
  'software.html': '软件管理', 'software-categories.html': '软件分类', 'software-templates.html': '软件模板',
  'drivers.html': '驱动管理', 'scripts.html': '脚本管理',
  'pe-versions.html': 'PE版本', 'pe-customize.html': 'PE定制',
  'pxe-configs.html': 'PXE配置', 'network-deploys.html': '网络部署',
  'customers.html': '客户管理', 'work-orders.html': '工单管理',
  'users.html': '用户管理', 'settings.html': '系统设置', 'logs.html': '操作日志',
  'notifications.html': '通知消息', 'scheduled-tasks.html': '定时任务',
  'reports.html': '报表统计', 'webhook-logs.html': 'Webhook日志', 'recycle-bin.html': '回收站'
};
(function() {
  var token = localStorage.getItem(TOKEN_KEY);
  if (!token) { window.location.href = '/admin/login.html'; return; }
  var userStr = localStorage.getItem(USER_KEY);
  if (userStr) {
    try {
      var user = JSON.parse(userStr);
      document.getElementById('userName').textContent = user.username || 'admin';
      document.getElementById('userAvatar').textContent = (user.username || 'A')[0].toUpperCase();
    } catch(e) {}
  }
})();
function switchPage(el, e) {
  document.querySelectorAll('.menu-item').forEach(function(item) { item.classList.remove('active'); });
  el.classList.add('active');
  var pageName = el.getAttribute('href').split('/').pop();
  document.getElementById('pageTitle').textContent = pageTitles[pageName] || '页面';
  return true;
}
function onFrameLoaded() {
  try { document.getElementById('contentFrame').style.height = '100%'; } catch(e) {}
}
function handleLogout() {
  if (!confirm('确定要退出登录吗？')) return;
  var token = localStorage.getItem(TOKEN_KEY);
  fetch('/api/v1/auth/logout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
  }).catch(function() {}).finally(function() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    window.location.href = '/admin/login.html';
  });
}
</script>
