<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作日志 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.log-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.log-detail-item{padding:10px 14px;background:#f8fafc;border-radius:6px;}
.log-detail-item .ld-label{font-size:12px;color:var(--text-light);margin-bottom:2px;}
.log-detail-item .ld-value{font-size:14px;color:var(--text);font-weight:500;word-break:break-all;}
.log-detail-full{grid-column:1 / -1;}
.log-type-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.log-type-badge.auth{background:#fef2f2;color:#dc2626;}
.log-type-badge.system{background:#f0fdf4;color:#16a34a;}
.log-type-badge.image{background:#dbeafe;color:#2563eb;}
.log-type-badge.task{background:#fff7ed;color:#ea580c;}
.log-type-badge.user{background:#f3e8ff;color:#9333ea;}
.log-type-badge.settings{background:#fef9c3;color:#a16207;}
.log-type-badge.other{background:#f1f5f9;color:#64748b;}
.clear-actions{display:flex;gap:8px;margin-left:auto;}
</style>
</head>
<body>
<h2>操作日志</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索操作内容/操作人/IP" style="min-width:200px;">
  <select id="searchType">
    <option value="">全部类型</option>
    <option value="auth">认证</option>
    <option value="system">系统</option>
    <option value="image">镜像</option>
    <option value="task">任务</option>
    <option value="user">用户</option>
    <option value="settings">设置</option>
    <option value="other">其他</option>
  </select>
  <button class="btn-search" onclick="searchLogs()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <div class="clear-actions">
    <button class="btn-create" style="background:#dc2626;" onclick="clearLogs()">清空日志</button>
  </div>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="logTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th style="width:80px;">类型</th>
          <th>操作内容</th>
          <th style="width:100px;">操作人</th>
          <th style="width:130px;">目标</th>
          <th style="width:130px;">IP地址</th>
          <th style="width:150px;">操作时间</th>
          <th style="width:100px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8"><div class="empty-state"><div class="empty-icon">&#x1F4DD;</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">&#x1F4DD;</div>
      <p>暂无日志数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];
  var LOCAL_KEY = "zs_admin_logs";

  function getLocalLogs() {
    try {
      var data = localStorage.getItem(LOCAL_KEY);
      return data ? JSON.parse(data) : [];
    } catch(e) {
      return [];
    }
  }

  function saveLocalLogs(logs) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(logs));
  }

  function getDefaultLogs() {
    var logs = [];
    var now = new Date();
    var types = ["auth", "system", "image", "task", "user", "settings"];
    var actions = ["登录系统", "退出登录", "修改系统配置", "添加镜像", "删除镜像", "创建任务", "取消任务", "添加用户", "修改用户密码", "清理日志"];
    var users = ["admin", "operator", "viewer"];
    var ips = ["192.168.1.100", "192.168.1.101", "10.0.0.1"];
    var targets = ["", "系统设置", "镜像ID:1", "任务ID:5", "用户:operator", "日志模块"];

    for (var i = 0; i < 30; i++) {
      var d = new Date(now.getTime() - i * 3600000);
      var type = types[Math.floor(Math.random() * types.length)];
      logs.push({
        id: i + 1,
        type: type,
        action: actions[Math.floor(Math.random() * actions.length)],
        username: users[Math.floor(Math.random() * users.length)],
        target: targets[Math.floor(Math.random() * targets.length)],
        detail: "这是一条" + type + "类型的操作日志记录",
        ip: ips[Math.floor(Math.random() * ips.length)],
        created_at: d.toISOString()
      });
    }
    return logs;
  }

  function loadLogs() {
    var keyword = document.getElementById("searchKeyword").value.trim();
    var type = document.getElementById("searchType").value;

    var params = "page=" + currentPage + "&pageSize=" + pageSize;
    if (keyword) params += "&keyword=" + encodeURIComponent(keyword);
    if (type) params += "&type=" + encodeURIComponent(type);

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "<tr><td colspan=\"8\" style=\"text-align:center;padding:40px;color:#94a3b8;\">加载中...</td></tr>";

    api("/logs?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        loadFromLocal();
      }
    }).catch(function(err) {
      loadFromLocal();
    });
  }

  function loadFromLocal() {
    var logs = getLocalLogs();
    if (logs.length === 0) {
      logs = getDefaultLogs();
      saveLocalLogs(logs);
    }

    var keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();
    var type = document.getElementById("searchType").value;

    var filtered = [];
    for (var i = 0; i < logs.length; i++) {
      var l = logs[i];
      if (keyword && l.action.toLowerCase().indexOf(keyword) === -1 && (l.username || "").toLowerCase().indexOf(keyword) === -1 && (l.ip || "").indexOf(keyword) === -1 && (l.detail || "").toLowerCase().indexOf(keyword) === -1) continue;
      if (type && l.type !== type) continue;
      filtered.push(l);
    }

    totalCount = filtered.length;
    var start = (currentPage - 1) * pageSize;
    var end = Math.min(start + pageSize, filtered.length);
    currentList = filtered.slice(start, end);

    renderTable(currentList);
    renderPagination();
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var typeLabel = getTypeLabel(item.type);
      var typeClass = item.type || "other";

      html += "<tr>";
      html += "<td>" + esc(item.id) + "</td>";
      html += "<td><span class=\"log-type-badge " + typeClass + "\">" + esc(typeLabel) + "</span></td>";
      html += "<td>" + esc(item.action) + "</td>";
      html += "<td>" + esc(item.username || "-") + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + esc(item.target || "-") + "</td>";
      html += "<td style=\"font-size:12px;font-family:monospace;\">" + esc(item.ip || "-") + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.created_at) + "</td>";
      html += "<td><button class=\"action-btn more\" onclick=\"viewLogDetail(" + item.id + ")\">详情</button></td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = "<div class=\"pagination\">";
    html += "<span class=\"page-info\">共 " + totalCount + " 条，第 " + currentPage + "/" + totalPages + " 页</span>";
    html += "<div class=\"page-btns\">";
    if (currentPage > 1) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(1)\">首页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage - 1) + ")\">上一页</button>";
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += "<button class=\"page-btn" + (i === currentPage ? " active" : "") + "\" onclick=\"goToPage(" + i + ")\">" + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage + 1) + ")\">下一页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + totalPages + ")\">末页</button>";
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  function getTypeLabel(type) {
    var map = { "auth": "认证", "system": "系统", "image": "镜像", "task": "任务", "user": "用户", "settings": "设置", "other": "其他" };
    return map[type] || type || "其他";
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadLogs();
  };

  window.searchLogs = function() {
    currentPage = 1;
    loadLogs();
  };

  window.resetSearch = function() {
    document.getElementById("searchKeyword").value = "";
    document.getElementById("searchType").value = "";
    currentPage = 1;
    loadLogs();
  };

  window.viewLogDetail = function(id) {
    id = parseInt(id, 10);
    var logs = getLocalLogs();
    var item = null;
    for (var i = 0; i < logs.length; i++) {
      if (logs[i].id === id) { item = logs[i]; break; }
    }
    if (!item) {
      toast("日志不存在", "error");
      return;
    }

    var content = "";
    content += "<div class=\"log-detail-grid\">";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">日志ID</div><div class=\"ld-value\">" + esc(item.id) + "</div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">类型</div><div class=\"ld-value\"><span class=\"log-type-badge " + (item.type || "other") + "\">" + esc(getTypeLabel(item.type)) + "</span></div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">操作内容</div><div class=\"ld-value\">" + esc(item.action) + "</div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">操作人</div><div class=\"ld-value\">" + esc(item.username || "-") + "</div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">目标对象</div><div class=\"ld-value\">" + esc(item.target || "-") + "</div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">IP地址</div><div class=\"ld-value\">" + esc(item.ip || "-") + "</div></div>";
    content += "<div class=\"log-detail-item\"><div class=\"ld-label\">操作时间</div><div class=\"ld-value\">" + fmtDate(item.created_at) + "</div></div>";
    if (item.detail) {
      content += "<div class=\"log-detail-item log-detail-full\"><div class=\"ld-label\">详细描述</div><div class=\"ld-value\">" + esc(item.detail) + "</div></div>";
    }
    content += "</div>";
    content += "<div class=\"form-actions\" style=\"margin-top:16px;\">";
    content += "<button class=\"btn-cancel\" onclick=\"closeModal()\">关闭</button>";
    content += "</div>";

    showModal("日志详情", content);
  };

  window.clearLogs = function() {
    if (!confirm("确定要清空所有操作日志吗？此操作不可恢复。")) return;

    api("/logs/clear", { method: "POST" }).then(function(res) {
      if (res.code === 0) {
        saveLocalLogs([]);
        toast("日志已清空", "success");
        currentPage = 1;
        loadLogs();
      } else {
        // Fallback: clear local
        saveLocalLogs([]);
        toast("本地日志已清空", "success");
        currentPage = 1;
        loadLogs();
      }
    }).catch(function(err) {
      saveLocalLogs([]);
      toast("本地日志已清空（服务器不可用）", "success");
      currentPage = 1;
      loadLogs();
    });
  };

  loadLogs();

})();
</script>
</body>
</html>
