<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.role-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;}
.role-badge.admin{background:#fef2f2;color:#dc2626;}
.role-badge.operator{background:#fff7ed;color:#ea580c;}
.role-badge.viewer{background:#f0fdf4;color:#16a34a;}
.role-badge.user{background:#dbeafe;color:#2563eb;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.status-dot.online{background:#16a34a;}
.status-dot.offline{background:#cbd5e1;}
</style>
</head>
<body>
<h2>用户管理</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索用户名/邮箱/姓名" style="min-width:200px;">
  <select id="searchRole">
    <option value="">全部角色</option>
    <option value="admin">管理员</option>
    <option value="operator">操作员</option>
    <option value="viewer">观察者</option>
    <option value="user">普通用户</option>
  </select>
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="active">启用</option>
    <option value="disabled">禁用</option>
  </select>
  <button class="btn-search" onclick="searchUsers()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddUserModal()">添加用户</button>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="userTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th style="width:80px;">头像</th>
          <th>用户名</th>
          <th>邮箱</th>
          <th>姓名</th>
          <th style="width:80px;">角色</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">最后登录</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:160px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#x1F465;</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">&#x1F465;</div>
      <p>暂无用户数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];
  var LOCAL_KEY = "zs_admin_users";

  function getLocalUsers() {
    try {
      var data = localStorage.getItem(LOCAL_KEY);
      return data ? JSON.parse(data) : [];
    } catch(e) {
      return [];
    }
  }

  function saveLocalUsers(users) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(users));
  }

  function generateId() {
    var users = getLocalUsers();
    var maxId = 0;
    for (var i = 0; i < users.length; i++) {
      if (users[i].id > maxId) maxId = users[i].id;
    }
    return maxId + 1;
  }

  function getDefaultUsers() {
    return [
      { id: 1, username: "admin", email: "admin@zs.com", real_name: "系统管理员", role: "admin", status: "active", last_login: new Date().toISOString(), created_at: "2025-01-01T00:00:00.000Z" },
      { id: 2, username: "operator", email: "op@zs.com", real_name: "操作员", role: "operator", status: "active", last_login: null, created_at: "2025-01-15T00:00:00.000Z" },
      { id: 3, username: "viewer", email: "view@zs.com", real_name: "观察员", role: "viewer", status: "active", last_login: null, created_at: "2025-02-01T00:00:00.000Z" }
    ];
  }

  function loadUsers() {
    var keyword = document.getElementById("searchKeyword").value.trim();
    var role = document.getElementById("searchRole").value;
    var status = document.getElementById("searchStatus").value;

    var params = "page=" + currentPage + "&pageSize=" + pageSize;
    if (keyword) params += "&keyword=" + encodeURIComponent(keyword);
    if (role) params += "&role=" + encodeURIComponent(role);
    if (status) params += "&status=" + encodeURIComponent(status);

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "<tr><td colspan=\"10\" style=\"text-align:center;padding:40px;color:#94a3b8;\">加载中...</td></tr>";

    api("/users?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        loadFromLocal();
      }
    }).catch(function(err) {
      loadFromLocal();
    });
  }

  function loadFromLocal() {
    var users = getLocalUsers();
    if (users.length === 0) {
      users = getDefaultUsers();
      saveLocalUsers(users);
    }

    var keyword = document.getElementById("searchKeyword").value.trim().toLowerCase();
    var role = document.getElementById("searchRole").value;
    var status = document.getElementById("searchStatus").value;

    var filtered = [];
    for (var i = 0; i < users.length; i++) {
      var u = users[i];
      if (keyword && u.username.toLowerCase().indexOf(keyword) === -1 && (u.email || "").toLowerCase().indexOf(keyword) === -1 && (u.real_name || "").toLowerCase().indexOf(keyword) === -1) continue;
      if (role && u.role !== role) continue;
      if (status && u.status !== status) continue;
      filtered.push(u);
    }

    totalCount = filtered.length;
    var start = (currentPage - 1) * pageSize;
    var end = Math.min(start + pageSize, filtered.length);
    currentList = filtered.slice(start, end);

    renderTable(currentList);
    renderPagination();
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var roleLabel = getRoleLabel(item.role);
      var roleClass = item.role || "user";
      var statusHtml = item.status === "active"
        ? "<span class=\"status-dot online\"></span>启用"
        : "<span class=\"status-dot offline\"></span>禁用";
      var avatar = item.real_name ? item.real_name[0].toUpperCase() : (item.username ? item.username[0].toUpperCase() : "?");

      html += "<tr>";
      html += "<td>" + esc(item.id) + "</td>";
      html += "<td><div style=\"width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;\">" + esc(avatar) + "</div></td>";
      html += "<td><strong>" + esc(item.username) + "</strong></td>";
      html += "<td>" + esc(item.email || "-") + "</td>";
      html += "<td>" + esc(item.real_name || "-") + "</td>";
      html += "<td><span class=\"role-badge " + roleClass + "\">" + esc(roleLabel) + "</span></td>";
      html += "<td>" + statusHtml + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.last_login) + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.created_at) + "</td>";
      html += "<td>";
      if (item.username !== "admin") {
        html += "<button class=\"action-btn edit\" onclick=\"editUser(" + item.id + ")\">编辑</button>";
        html += "<button class=\"action-btn delete\" onclick=\"deleteUser(" + item.id + ")\">删除</button>";
      } else {
        html += "<span style=\"font-size:12px;color:var(--text-light);\">-</span>";
      }
      html += "</td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = "<div class=\"pagination\">";
    html += "<span class=\"page-info\">共 " + totalCount + " 条，第 " + currentPage + "/" + totalPages + " 页</span>";
    html += "<div class=\"page-btns\">";
    if (currentPage > 1) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(1)\">首页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage - 1) + ")\">上一页</button>";
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += "<button class=\"page-btn" + (i === currentPage ? " active" : "") + "\" onclick=\"goToPage(" + i + ")\">" + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage + 1) + ")\">下一页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + totalPages + ")\">末页</button>";
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  function getRoleLabel(role) {
    var map = { "admin": "管理员", "operator": "操作员", "viewer": "观察者", "user": "普通用户" };
    return map[role] || role || "普通用户";
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadUsers();
  };

  window.searchUsers = function() {
    currentPage = 1;
    loadUsers();
  };

  window.resetSearch = function() {
    document.getElementById("searchKeyword").value = "";
    document.getElementById("searchRole").value = "";
    document.getElementById("searchStatus").value = "";
    currentPage = 1;
    loadUsers();
  };

  window.showAddUserModal = function() {
    var content = "";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>用户名 <span style=\"color:#dc2626;\">*</span></label><input type=\"text\" id=\"formUsername\" placeholder=\"登录用户名\"></div>";
    content += "<div class=\"form-group\"><label>密码 <span style=\"color:#dc2626;\">*</span></label><input type=\"password\" id=\"formPassword\" placeholder=\"登录密码\"></div>";
    content += "</div>";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>邮箱</label><input type=\"email\" id=\"formEmail\" placeholder=\"user@example.com\"></div>";
    content += "<div class=\"form-group\"><label>姓名</label><input type=\"text\" id=\"formRealName\" placeholder=\"真实姓名\"></div>";
    content += "</div>";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>角色</label><select id=\"formRole\"><option value=\"user\">普通用户</option><option value=\"operator\">操作员</option><option value=\"viewer\">观察者</option><option value=\"admin\">管理员</option></select></div>";
    content += "<div class=\"form-group\"><label>状态</label><select id=\"formStatus\"><option value=\"active\">启用</option><option value=\"disabled\">禁用</option></select></div>";
    content += "</div>";
    content += "<div class=\"form-actions\">";
    content += "<button class=\"btn-cancel\" onclick=\"closeModal()\">取消</button>";
    content += "<button class=\"btn-submit\" onclick=\"saveUser()\">保存</button>";
    content += "</div>";

    var modal = showModal("添加用户", content);
    modal.setAttribute("data-mode", "add");
    modal.setAttribute("data-id", "");
  };

  window.editUser = function(id) {
    id = parseInt(id, 10);
    var users = getLocalUsers();
    var item = null;
    for (var i = 0; i < users.length; i++) {
      if (users[i].id === id) { item = users[i]; break; }
    }
    if (!item) {
      toast("用户不存在", "error");
      return;
    }

    var content = "";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>用户名</label><input type=\"text\" id=\"formUsername\" value=\"" + esc(item.username) + "\" readonly style=\"background:#f8f9fa;\"></div>";
    content += "<div class=\"form-group\"><label>密码</label><input type=\"password\" id=\"formPassword\" placeholder=\"留空则不修改\"></div>";
    content += "</div>";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>邮箱</label><input type=\"email\" id=\"formEmail\" value=\"" + esc(item.email || "") + "\"></div>";
    content += "<div class=\"form-group\"><label>姓名</label><input type=\"text\" id=\"formRealName\" value=\"" + esc(item.real_name || "") + "\"></div>";
    content += "</div>";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>角色</label><select id=\"formRole\">";
    var roles = ["user", "operator", "viewer", "admin"];
    for (var ri = 0; ri < roles.length; ri++) {
      content += "<option value=\"" + roles[ri] + "\"" + (item.role === roles[ri] ? " selected" : "") + ">" + getRoleLabel(roles[ri]) + "</option>";
    }
    content += "</select></div>";
    content += "<div class=\"form-group\"><label>状态</label><select id=\"formStatus\"><option value=\"active\"" + (item.status === "active" ? " selected" : "") + ">启用</option><option value=\"disabled\"" + (item.status === "disabled" ? " selected" : "") + ">禁用</option></select></div>";
    content += "</div>";
    content += "<div class=\"form-actions\">";
    content += "<button class=\"btn-cancel\" onclick=\"closeModal()\">取消</button>";
    content += "<button class=\"btn-submit\" onclick=\"saveUser()\">保存</button>";
    content += "</div>";

    var modal = showModal("编辑用户 - " + esc(item.username), content);
    modal.setAttribute("data-mode", "edit");
    modal.setAttribute("data-id", id);
  };

  window.saveUser = function() {
    var modal = document.getElementById("modalOverlay");
    var mode = modal ? modal.getAttribute("data-mode") : "add";
    var id = modal ? parseInt(modal.getAttribute("data-id"), 10) : 0;

    var username = document.getElementById("formUsername").value.trim();
    var password = document.getElementById("formPassword").value;
    var email = document.getElementById("formEmail").value.trim();
    var realName = document.getElementById("formRealName").value.trim();
    var role = document.getElementById("formRole").value;
    var status = document.getElementById("formStatus").value;

    if (!username) {
      toast("请输入用户名", "error");
      return;
    }

    if (mode === "add" && !password) {
      toast("请输入密码", "error");
      return;
    }

    var users = getLocalUsers();

    if (mode === "add") {
      for (var i = 0; i < users.length; i++) {
        if (users[i].username === username) {
          toast("用户名已存在", "error");
          return;
        }
      }

      var newUser = {
        id: generateId(),
        username: username,
        email: email,
        real_name: realName,
        role: role,
        status: status,
        last_login: null,
        created_at: new Date().toISOString()
      };
      users.push(newUser);
      saveLocalUsers(users);
      toast("用户添加成功", "success");
    } else {
      for (var j = 0; j < users.length; j++) {
        if (users[j].id === id) {
          users[j].email = email;
          users[j].real_name = realName;
          users[j].role = role;
          users[j].status = status;
          break;
        }
      }
      saveLocalUsers(users);
      toast("用户更新成功", "success");
    }

    closeModal();
    loadUsers();
  };

  window.deleteUser = function(id) {
    id = parseInt(id, 10);
    if (!confirm("确定要删除该用户吗？此操作不可恢复。")) return;

    var users = getLocalUsers();
    var newUsers = [];
    for (var i = 0; i < users.length; i++) {
      if (users[i].id !== id) {
        newUsers.push(users[i]);
      }
    }
    saveLocalUsers(newUsers);
    toast("用户删除成功", "success");
    loadUsers();
  };

  loadUsers();

})();
</script>
</body>
</html>
