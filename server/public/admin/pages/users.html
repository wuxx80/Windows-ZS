<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.role-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;}
.role-badge.code-admin{background:#fef2f2;color:#dc2626;}
.role-badge.code-super_admin{background:#fef2f2;color:#dc2626;}
.role-badge.code-operator{background:#fff7ed;color:#ea580c;}
.role-badge.code-viewer{background:#f0fdf4;color:#16a34a;}
.role-badge.code-user{background:#dbeafe;color:#2563eb;}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.status-dot.online{background:#16a34a;}
.status-dot.offline{background:#cbd5e1;}
</style>
</head>
<body>
<h2>用户管理</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索用户名/邮箱/姓名" style="min-width:200px;">
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="1">启用</option>
    <option value="0">禁用</option>
  </select>
  <button class="btn-search" onclick="searchUsers()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddUserModal()">添加用户</button>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="userTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th style="width:80px;">头像</th>
          <th>用户名</th>
          <th>邮箱</th>
          <th>姓名</th>
          <th style="width:80px;">角色</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">最后登录</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:160px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="10"><div class="empty-state"><div class="empty-icon">&#x1F465;</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">&#x1F465;</div>
      <p>暂无用户数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  // 角色缓存：{ id: { id, name, code, description, status } }
  var roleMap = {};

  // 从 API 加载角色列表，缓存到 roleMap
  function loadRoles() {
    return api("/roles?pageSize=100").then(function(res) {
      if (res.code === 0 && res.data && res.data.list) {
        for (var i = 0; i < res.data.list.length; i++) {
          var r = res.data.list[i];
          roleMap[r.id] = r;
        }
      }
    }).catch(function() {});
  }

  function getRoleName(roleId) {
    var r = roleMap[roleId];
    return r ? r.name : ("角色#" + roleId);
  }

  function getRoleCode(roleId) {
    var r = roleMap[roleId];
    return r ? r.code : "user";
  }

  function loadUsers() {
    var keyword = document.getElementById("searchKeyword").value.trim();
    var status = document.getElementById("searchStatus").value;

    var params = "page=" + currentPage + "&pageSize=" + pageSize;
    if (keyword) params += "&keyword=" + encodeURIComponent(keyword);
    if (status !== "") params += "&status=" + encodeURIComponent(status);

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';

    api("/users?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        renderTable(res.data.list || []);
        renderPagination();
      } else {
        toast(res.message || "加载失败", "error");
        renderTable([]);
      }
    }).catch(function(err) {
      toast("网络错误", "error");
      renderTable([]);
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var roleCode = getRoleCode(item.role_id);
      var roleName = getRoleName(item.role_id);
      var statusVal = parseInt(item.status, 10);
      var statusHtml = statusVal === 1
        ? '<span class="status-dot online"></span>启用'
        : '<span class="status-dot offline"></span>禁用';
      var avatar = (item.nickname || item.username || "?")[0].toUpperCase();

      html += "<tr>";
      html += "<td>" + esc(item.id) + "</td>";
      html += '<td><div style="width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;">' + esc(avatar) + "</div></td>";
      html += "<td>" + esc(item.username) + "</td>";
      html += "<td>" + esc(item.email || "-") + "</td>";
      html += "<td>" + esc(item.nickname || "-") + "</td>";
      html += '<td><span class="role-badge code-' + esc(roleCode) + '">' + esc(roleName) + "</span></td>";
      html += "<td>" + statusHtml + "</td>";
      html += '<td style="font-size:12px;color:var(--text-light);">' + fmtDate(item.last_login) + "</td>";
      html += '<td style="font-size:12px;color:var(--text-light);">' + fmtDate(item.created_at) + "</td>";
      html += "<td>";
      if (item.username !== "admin") {
        html += '<button class="action-btn edit" onclick="editUser(' + item.id + ')">编辑</button>';
        html += '<button class="action-btn delete" onclick="deleteUser(' + item.id + ')">删除</button>';
      } else {
        html += '<span style="font-size:12px;color:var(--text-light);">-</span>';
      }
      html += "</td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalCount + ' 条，第 ' + currentPage + "/" + totalPages + " 页</span>";
    html += '<div class="page-btns">';
    if (currentPage > 1) {
      html += '<button class="page-btn" onclick="goToPage(1)">首页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="page-btn' + (i === currentPage ? " active" : "") + '" onclick="goToPage(' + i + ')">' + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>';
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  function buildRoleOptions(selectedRoleId) {
    var html = "";
    var ids = Object.keys(roleMap);
    // 按 id 排序
    ids.sort(function(a, b) { return parseInt(a) - parseInt(b); });
    for (var i = 0; i < ids.length; i++) {
      var r = roleMap[ids[i]];
      var sel = (parseInt(selectedRoleId) === parseInt(r.id)) ? " selected" : "";
      html += '<option value="' + r.id + '"' + sel + ">" + esc(r.name) + "</option>";
    }
    return html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadUsers();
  };

  window.searchUsers = function() {
    currentPage = 1;
    loadUsers();
  };

  window.resetSearch = function() {
    document.getElementById("searchKeyword").value = "";
    document.getElementById("searchStatus").value = "";
    currentPage = 1;
    loadUsers();
  };

  window.showAddUserModal = function() {
    var content = "";
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>用户名 <span style="color:#dc2626;">*</span></label><input type="text" id="formUsername" placeholder="登录用户名"></div>';
    content += '<div class="form-group"><label>密码 <span style="color:#dc2626;">*</span></label><input type="password" id="formPassword" placeholder="登录密码"></div>';
    content += "</div>";
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>邮箱</label><input type="email" id="formEmail" placeholder="user@example.com"></div>';
    content += '<div class="form-group"><label>姓名</label><input type="text" id="formNickname" placeholder="昵称"></div>';
    content += "</div>";
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>角色</label><select id="formRoleId">' + buildRoleOptions() + "</select></div>";
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="1">启用</option><option value="0">禁用</option></select></div>';
    content += "</div>";
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveUser()">保存</button>';
    content += "</div>";

    var modal = showModal("添加用户", content);
    modal.setAttribute("data-mode", "add");
    modal.setAttribute("data-id", "");
  };

  window.editUser = function(id) {
    // 从当前列表查找用户数据
    api("/users/" + id).then(function(res) {
      if (res.code !== 0 || !res.data) {
        toast("用户不存在", "error");
        return;
      }
      var item = res.data;

      var content = "";
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>用户名</label><input type="text" id="formUsername" value="' + esc(item.username) + '" readonly style="background:#f8f9fa;"></div>';
      content += '<div class="form-group"><label>密码</label><input type="password" id="formPassword" placeholder="留空则不修改"></div>';
      content += "</div>";
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>邮箱</label><input type="email" id="formEmail" value="' + esc(item.email || "") + '"></div>';
      content += '<div class="form-group"><label>姓名</label><input type="text" id="formNickname" value="' + esc(item.nickname || "") + '"></div>';
      content += "</div>";
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>角色</label><select id="formRoleId">' + buildRoleOptions(item.role_id) + "</select></div>";
      var statusSel = parseInt(item.status) === 1 ? "1" : "0";
      content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="1"' + (statusSel === "1" ? " selected" : "") + '>启用</option><option value="0"' + (statusSel === "0" ? " selected" : "") + '>禁用</option></select></div>';
      content += "</div>";
      content += '<div class="form-actions">';
      content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
      content += '<button class="btn-submit" onclick="saveUser()">保存</button>';
      content += "</div>";

      var modal = showModal("编辑用户 - " + esc(item.username), content);
      modal.setAttribute("data-mode", "edit");
      modal.setAttribute("data-id", id);
    }).catch(function() {
      toast("加载用户失败", "error");
    });
  };

  window.saveUser = function() {
    var modal = document.getElementById("modalOverlay");
    var mode = modal ? modal.getAttribute("data-mode") : "add";
    var id = modal ? parseInt(modal.getAttribute("data-id"), 10) : 0;

    var username = document.getElementById("formUsername").value.trim();
    var password = document.getElementById("formPassword").value;
    var email = document.getElementById("formEmail").value.trim();
    var nickname = document.getElementById("formNickname").value.trim();
    var roleId = parseInt(document.getElementById("formRoleId").value, 10) || 0;
    var status = parseInt(document.getElementById("formStatus").value, 10);

    if (!username) {
      toast("请输入用户名", "error");
      return;
    }
    if (mode === "add" && !password) {
      toast("请输入密码", "error");
      return;
    }

    var body = {
      username: username,
      email: email,
      nickname: nickname,
      role_id: roleId,
      status: status
    };
    if (password) body.password = password;

    if (mode === "add") {
      api("/users", { method: "POST", body: body }).then(function(res) {
        if (res.code === 0) {
          toast("用户添加成功", "success");
          closeModal();
          loadUsers();
        } else {
          toast(res.message || "添加失败", "error");
        }
      }).catch(function() {
        toast("网络错误", "error");
      });
    } else {
      api("/users/" + id, { method: "PUT", body: body }).then(function(res) {
        if (res.code === 0) {
          toast("用户更新成功", "success");
          closeModal();
          loadUsers();
        } else {
          toast(res.message || "更新失败", "error");
        }
      }).catch(function() {
        toast("网络错误", "error");
      });
    }
  };

  window.deleteUser = function(id) {
    if (!confirm("确定要删除该用户吗？此操作不可恢复。")) return;

    api("/users/" + id, { method: "DELETE" }).then(function(res) {
      if (res.code === 0) {
        toast("用户删除成功", "success");
        loadUsers();
      } else {
        toast(res.message || "删除失败", "error");
      }
    }).catch(function() {
      toast("网络错误", "error");
    });
  };

  // 先加载角色，再加载用户
  loadRoles().then(function() {
    loadUsers();
  });

})();
</script>
</body>
</html>
