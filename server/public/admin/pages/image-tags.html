<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜像标签管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.color-preview{display:inline-block;width:20px;height:20px;border-radius:4px;vertical-align:middle;margin-right:6px;border:1px solid #e2e8f0;}
</style>
</head>
<body>
<h2>镜像标签管理</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索标签名称" style="min-width:200px;">
  <button class="btn-search" onclick="searchTags()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">添加标签</button>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>标签名称</th>
          <th style="width:120px;">颜色</th>
          <th style="width:100px;">镜像数量</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:160px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🏷️</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">🏷️</div>
      <p>暂无标签数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];
  function loadList() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';
    api('/imageTags?' + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }
  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');
    if (!list || list.length === 0) { tableBody.innerHTML = ''; emptyState.style.display = 'block'; return; }
    emptyState.style.display = 'none';
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var color = item.color || '#1a73e8';
      html += '<tr>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><strong>' + esc(item.name) + '</strong></td>';
      html += '<td><span class="color-preview" style="background:' + esc(color) + ';"></span><span style="font-family:Consolas,monospace;font-size:12px;color:var(--text-light);">' + esc(color) + '</span></td>';
      html += '<td>' + (item.image_count != null ? item.image_count : 0) + '</td>';
      html += '<td style="font-size:12px;color:var(--text-light);">' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      html += '<button class="action-btn edit" onclick="showEditModal(' + item.id + ')">编辑</button>';
      html += '<button class="action-btn delete" onclick="deleteTag(' + item.id + ')">删除</button>';
      html += '</td></tr>';
    }
    tableBody.innerHTML = html;
  }
  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) { container.innerHTML = ''; return; }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalCount + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) { html += '<button class="page-btn" onclick="goToPage(1)">首页</button>'; html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>'; }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) { html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>'; }
    if (currentPage < totalPages) { html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>'; html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>'; }
    html += '</div></div>';
    container.innerHTML = html;
  }
  window.goToPage = function(page) { currentPage = page; loadList(); };
  window.searchTags = function() { currentPage = 1; loadList(); };
  window.resetSearch = function() { document.getElementById('searchKeyword').value = ''; currentPage = 1; loadList(); };
  function buildFormHtml(item) {
    var name = item ? esc(item.name) : '';
    var color = item ? esc(item.color) : '#1a73e8';
    var content = '';
    content += '<div class="form-group"><label>标签名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" value="' + name + '" placeholder="标签名称"></div>';
    content += '<div class="form-group"><label>颜色</label><div style="display:flex;gap:12px;align-items:center;"><input type="color" id="formColor" value="' + color + '" style="width:50px;height:36px;padding:2px;cursor:pointer;"><input type="text" id="formColorText" value="' + color + '" placeholder="#1a73e8" style="flex:1;" onchange="document.getElementById(\'formColor\').value=this.value"></div></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveTag()">保存</button>';
    content += '</div>';
    return content;
  }
  window.showAddModal = function() { var modal = showModal('添加标签', buildFormHtml(null)); modal.setAttribute('data-mode', 'add'); modal.setAttribute('data-id', ''); };
  window.showEditModal = function(id) {
    api('/imageTags/' + id).then(function(res) {
      if (res.code !== 0) { toast(res.message || '获取详情失败', 'error'); return; }
      var item = res.data;
      var modal = showModal('编辑标签 - ' + esc(item.name), buildFormHtml(item));
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) { toast('获取详情失败: ' + (err.message || '未知错误'), 'error'); });
  };
  window.saveTag = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';
    var name = document.getElementById('formName').value.trim();
    var color = document.getElementById('formColor').value;
    if (!name) { toast('请输入标签名称', 'error'); return; }
    var body = { name: name, color: color };
    var request;
    if (mode === 'edit' && id) { request = api('/imageTags/' + id, { method: 'PUT', body: body }); }
    else { request = api('/imageTags', { method: 'POST', body: body }); }
    request.then(function(res) {
      if (res.code === 0) { toast(mode === 'edit' ? '更新成功' : '创建成功', 'success'); closeModal(); loadList(); }
      else { toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error'); }
    }).catch(function(err) { toast('网络请求失败: ' + (err.message || '未知错误'), 'error'); });
  };
  window.deleteTag = function(id) {
    if (!confirm('确定要删除该标签吗？相关镜像的标签关联将被移除。')) return;
    api('/imageTags/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) { toast('删除成功', 'success'); loadList(); }
      else { toast(res.message || '删除失败', 'error'); }
    }).catch(function(err) { toast('网络请求失败: ' + (err.message || '未知错误'), 'error'); });
  };
  loadList();
})();
</script>
</body>
</html>
