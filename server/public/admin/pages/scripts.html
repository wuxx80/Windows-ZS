<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>脚本管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:0;background:transparent;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}
h2{margin-bottom:16px;font-size:20px;font-weight:600;color:#334155;}
.search-bar{margin-bottom:16px;}
.panel-body{position:relative;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.data-table .name-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.data-table .desc-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.data-table .content-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-item{padding:10px 14px;background:#f8fafc;border-radius:6px;}
.detail-item .dt-label{font-size:12px;color:#64748b;margin-bottom:2px;}
.detail-item .dt-value{font-size:14px;color:#1e293b;font-weight:500;word-break:break-all;}
.detail-full{grid-column:1 / -1;}
.code-block{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:6px;font-size:12px;font-family:Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow:auto;}
</style>
</head>
<body>

<h2>脚本管理</h2>

<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="脚本名称/描述" style="min-width:200px;">
  <select id="searchType">
    <option value="">全部类型</option>
    <option value="powershell">PowerShell</option>
    <option value="batch">Batch</option>
    <option value="vbs">VBScript</option>
    <option value="python">Python</option>
    <option value="other">其他</option>
  </select>
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="enabled">启用</option>
    <option value="disabled">禁用</option>
  </select>
  <button class="btn-search" onclick="searchScripts()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">新增脚本</button>
</div>

<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th style="width:150px;">名称</th>
          <th style="width:80px;">类型</th>
          <th style="width:200px;">描述</th>
          <th style="width:200px;">内容</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:200px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">&#x1F4C4;</div>
      <p>暂无脚本数据</p>
    </div>
  </div>
</div>

<div id="paginationContainer"></div>

<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];

  var typeMap = {
    'powershell': 'PowerShell',
    'batch': 'Batch',
    'vbs': 'VBScript',
    'python': 'Python',
    'other': '其他'
  };

  function getTypeLabel(type) {
    return typeMap[type] || type || '-';
  }

  function loadScripts() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var type = document.getElementById('searchType').value;
    var status = document.getElementById('searchStatus').value;

    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (type) params += '&type=' + encodeURIComponent(type);
    if (status) params += '&status=' + encodeURIComponent(status);

    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';

    api('/scripts?' + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');

    if (!list || list.length === 0) {
      tableBody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var contentPreview = item.content ? item.content.replace(/\n/g, ' ').substring(0, 50) : '-';
      html += '<tr>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><div class="name-cell" title="' + esc(item.name) + '">' + esc(item.name) + '</div></td>';
      html += '<td>' + esc(getTypeLabel(item.type)) + '</td>';
      html += '<td><div class="desc-cell" title="' + esc(item.description || '') + '">' + esc(item.description || '-') + '</div></td>';
      html += '<td><div class="content-cell" title="' + esc(item.content || '') + '">' + esc(contentPreview) + '</div></td>';
      html += '<td>' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</td>';
      html += '<td>' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      html += '<button class="action-btn edit" onclick="showEditModal(\'' + item.id + '\')">编辑</button>';
      html += '<button class="action-btn more" onclick="viewScriptContent(\'' + item.id + '\')">查看</button>';
      html += '<button class="action-btn more" style="background:#16a34a;color:#fff;" onclick="executeScript(\'' + item.id + '\')">执行</button>';
      html += '<button class="action-btn delete" onclick="deleteScript(\'' + item.id + '\')">删除</button>';
      html += '</td>';
      html += '</tr>';
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalCount + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) {
      html += '<button class="page-btn" onclick="goToPage(1)">首页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    }
    if (currentPage < totalPages) {
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>';
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadScripts();
  };

  window.searchScripts = function() {
    currentPage = 1;
    loadScripts();
  };

  window.resetSearch = function() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchType').value = '';
    document.getElementById('searchStatus').value = '';
    currentPage = 1;
    loadScripts();
  };

  window.showAddModal = function() {
    var content = '';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>脚本名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" placeholder="脚本名称"></div>';
    content += '<div class="form-group"><label>类型 <span style="color:#dc2626;">*</span></label><select id="formType">';
    content += '<option value="">请选择</option>';
    content += '<option value="powershell">PowerShell</option>';
    content += '<option value="batch">Batch</option>';
    content += '<option value="vbs">VBScript</option>';
    content += '<option value="python">Python</option>';
    content += '<option value="other">其他</option>';
    content += '</select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>描述</label><textarea id="formDescription" rows="2" placeholder="脚本描述"></textarea></div>';
    content += '<div class="form-group"><label>脚本内容 <span style="color:#dc2626;">*</span></label><textarea id="formContent" rows="8" placeholder="请输入脚本内容..." style="font-family:Consolas,monospace;font-size:13px;"></textarea></div>';
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="enabled">启用</option><option value="disabled">禁用</option></select></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveScript()">保存</button>';
    content += '</div>';

    var modal = showModal('新增脚本', content);
    modal.setAttribute('data-mode', 'add');
    modal.setAttribute('data-id', '');
  };

  window.showEditModal = function(id) {
    api('/scripts/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var content = '';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>脚本名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" value="' + esc(item.name) + '"></div>';
      content += '<div class="form-group"><label>类型 <span style="color:#dc2626;">*</span></label><select id="formType">';
      content += '<option value="">请选择</option>';
      var types = ['powershell', 'batch', 'vbs', 'python', 'other'];
      var typeLabels = ['PowerShell', 'Batch', 'VBScript', 'Python', '其他'];
      for (var ti = 0; ti < types.length; ti++) {
        content += '<option value="' + types[ti] + '"' + (item.type === types[ti] ? ' selected' : '') + '>' + typeLabels[ti] + '</option>';
      }
      content += '</select></div>';
      content += '</div>';
      content += '<div class="form-group"><label>描述</label><textarea id="formDescription" rows="2">' + esc(item.description || '') + '</textarea></div>';
      content += '<div class="form-group"><label>脚本内容 <span style="color:#dc2626;">*</span></label><textarea id="formContent" rows="8" style="font-family:Consolas,monospace;font-size:13px;">' + esc(item.content || '') + '</textarea></div>';
      content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="enabled"' + (item.status === 'enabled' ? ' selected' : '') + '>启用</option><option value="disabled"' + (item.status === 'disabled' ? ' selected' : '') + '>禁用</option></select></div>';
      content += '<div class="form-actions">';
      content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
      content += '<button class="btn-submit" onclick="saveScript()">保存</button>';
      content += '</div>';

      var modal = showModal('编辑脚本', content);
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) {
      toast('获取脚本详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.saveScript = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';

    var name = document.getElementById('formName').value.trim();
    var type = document.getElementById('formType').value;
    var description = document.getElementById('formDescription').value.trim();
    var content = document.getElementById('formContent').value;
    var status = document.getElementById('formStatus').value;

    if (!name) {
      toast('请输入脚本名称', 'error');
      return;
    }
    if (!type) {
      toast('请选择脚本类型', 'error');
      return;
    }
    if (!content) {
      toast('请输入脚本内容', 'error');
      return;
    }

    var body = {
      name: name,
      type: type,
      description: description,
      content: content,
      status: status
    };

    var request;
    if (mode === 'edit' && id) {
      request = api('/scripts/' + id, { method: 'PUT', body: body });
    } else {
      request = api('/scripts', { method: 'POST', body: body });
    }

    request.then(function(res) {
      if (res.code === 0) {
        toast(mode === 'edit' ? '更新成功' : '创建成功', 'success');
        closeModal();
        loadScripts();
      } else {
        toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.deleteScript = function(id) {
    if (!confirm('确定要删除该脚本吗？此操作不可恢复。')) return;
    api('/scripts/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) {
        toast('删除成功', 'success');
        loadScripts();
      } else {
        toast(res.message || '删除失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.viewScriptContent = function(id) {
    toast('正在加载脚本内容...', 'info');
    api('/scripts/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取脚本失败', 'error');
        return;
      }
      var item = res.data;
      var content = '';
      content += '<div class="detail-grid">';
      content += '<div class="detail-item"><div class="dt-label">名称</div><div class="dt-value">' + esc(item.name) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">类型</div><div class="dt-value">' + esc(getTypeLabel(item.type)) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</div></div>';
      content += '<div class="detail-item detail-full"><div class="dt-label">描述</div><div class="dt-value">' + esc(item.description || '-') + '</div></div>';
      content += '</div>';
      content += '<div style="margin-top:12px;margin-bottom:6px;font-size:13px;font-weight:500;color:#334155;">脚本内容</div>';
      content += '<div class="code-block">' + esc(item.content || '') + '</div>';
      content += '<div class="form-actions" style="margin-top:16px;">';
      content += '<button class="btn-cancel" onclick="closeModal()">关闭</button>';
      content += '<button class="action-btn edit" style="padding:8px 20px;font-size:13px;" onclick="closeModal();showEditModal(\'' + item.id + '\')">编辑</button>';
      content += '</div>';

      showModal('脚本内容 - ' + esc(item.name), content);
    }).catch(function(err) {
      toast('获取脚本失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.executeScript = function(id) {
    if (!confirm('确定要执行该脚本吗？')) return;
    toast('正在执行脚本...', 'info');
    api('/scripts/' + id + '/execute', { method: 'POST' }).then(function(res) {
      if (res.code === 0) {
        var output = res.data && res.data.output ? res.data.output : (res.data || '执行完成');
        var content = '';
        content += '<div style="margin-bottom:8px;font-size:14px;font-weight:500;color:#334155;">执行输出</div>';
        content += '<div class="code-block" style="max-height:500px;">' + esc(output) + '</div>';
        content += '<div class="form-actions" style="margin-top:16px;">';
        content += '<button class="btn-cancel" onclick="closeModal()">关闭</button>';
        content += '</div>';

        showModal('脚本执行结果', content);
        loadScripts();
      } else {
        toast(res.message || '执行失败', 'error');
      }
    }).catch(function(err) {
      toast('执行请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  loadScripts();

})();
</script>
</body>
</html>
