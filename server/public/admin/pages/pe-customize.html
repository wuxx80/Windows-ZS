<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PE定制 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}
h2{margin-bottom:16px;font-size:20px;font-weight:600;color:#334155;}
.search-bar{margin-bottom:16px;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.data-table .tools-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-item{padding:10px 14px;background:#f8fafc;border-radius:6px;}
.detail-item .dt-label{font-size:12px;color:#64748b;margin-bottom:2px;}
.detail-item .dt-value{font-size:14px;color:#1e293b;font-weight:500;word-break:break-all;}
.detail-full{grid-column:1 / -1;}
</style>
</head>
<body>

<h2>PE定制</h2>

<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="关键词搜索（名称/基础PE版本）" style="min-width:200px;">
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="draft">草稿</option>
    <option value="building">构建中</option>
    <option value="completed">已完成</option>
    <option value="failed">失败</option>
  </select>
  <button class="btn-search" onclick="searchCustomize()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">新增定制</button>
</div>

<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>名称</th>
          <th style="width:120px;">基础PE版本</th>
          <th>包含工具</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:220px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">🛠️</div>
      <p>暂无PE定制数据</p>
    </div>
  </div>
</div>

<div id="paginationContainer"></div>

<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalItems = 0;
  var currentList = [];

  function loadList() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var status = document.getElementById('searchStatus').value;

    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (status) params += '&status=' + encodeURIComponent(status);

    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';

    api('/peCustomize?' + params).then(function(res) {
      if (res.code === 0) {
        totalItems = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');

    if (!list || list.length === 0) {
      tableBody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var statusMap = { draft: '草稿', building: '构建中', completed: '已完成', failed: '失败' };
      var statusText = statusMap[item.status] || item.status;
      var tools = '';
      if (item.included_tools) {
        if (typeof item.included_tools === 'string') {
          try { tools = JSON.parse(item.included_tools).join(', '); } catch(e) { tools = item.included_tools; }
        } else if (Array.isArray(item.included_tools)) {
          tools = item.included_tools.join(', ');
        }
      }
      html += '<tr>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><strong>' + esc(item.name) + '</strong></td>';
      html += '<td>' + esc(item.base_pe_version || '-') + '</td>';
      html += '<td><div class="tools-cell" title="' + esc(tools) + '">' + esc(tools || '-') + '</div></td>';
      html += '<td>' + statusBadge(item.status, statusText) + '</td>';
      html += '<td>' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      html += '<button class="action-btn edit" onclick="showEditModal(' + item.id + ')">编辑</button>';
      html += '<button class="action-btn delete" onclick="deleteItem(' + item.id + ')">删除</button>';
      if (item.status === 'draft' || item.status === 'failed') {
        html += '<button class="action-btn run" onclick="buildItem(' + item.id + ')">构建</button>';
      }
      if (item.status === 'completed') {
        html += '<button class="action-btn more" onclick="downloadItem(' + item.id + ')">下载</button>';
      }
      html += '<button class="action-btn more" onclick="viewDetail(' + item.id + ')">详情</button>';
      html += '</td>';
      html += '</tr>';
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalItems / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalItems + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) {
      html += '<button class="page-btn" onclick="goToPage(1)">首页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    }
    if (currentPage < totalPages) {
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>';
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadList();
  };

  window.searchCustomize = function() {
    currentPage = 1;
    loadList();
  };

  window.resetSearch = function() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchStatus').value = '';
    currentPage = 1;
    loadList();
  };

  function getFormData() {
    var toolsVal = document.getElementById('formTools').value.trim();
    var tools = [];
    if (toolsVal) {
      tools = toolsVal.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t; });
    }
    return {
      name: document.getElementById('formName').value.trim(),
      base_pe_version: document.getElementById('formBasePeVersion').value.trim(),
      included_tools: tools,
      wallpaper: document.getElementById('formWallpaper').value.trim(),
      extra_files: document.getElementById('formExtraFiles').value.trim(),
      status: document.getElementById('formStatus').value
    };
  }

  function buildFormContent(data) {
    var name = data ? esc(data.name) : '';
    var basePeVersion = data ? esc(data.base_pe_version) : '';
    var wallpaper = data ? esc(data.wallpaper) : '';
    var extraFiles = data ? esc(data.extra_files) : '';
    var status = data ? (data.status || 'draft') : 'draft';

    var toolsStr = '';
    if (data) {
      if (data.included_tools) {
        if (typeof data.included_tools === 'string') {
          try { toolsStr = JSON.parse(data.included_tools).join(', '); } catch(e) { toolsStr = data.included_tools; }
        } else if (Array.isArray(data.included_tools)) {
          toolsStr = data.included_tools.join(', ');
        }
      }
    }

    var content = '';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" value="' + name + '" placeholder="定制PE名称"></div>';
    content += '<div class="form-group"><label>基础PE版本</label><input type="text" id="formBasePeVersion" value="' + basePeVersion + '" placeholder="如: 10.0.22000"></div>';
    content += '</div>';
    content += '<div class="form-group"><label>包含工具 (逗号分隔)</label><input type="text" id="formTools" value="' + esc(toolsStr) + '" placeholder="如: 7-Zip, Notepad++, DiskGenius"></div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>壁纸路径</label><input type="text" id="formWallpaper" value="' + wallpaper + '" placeholder="壁纸文件路径"></div>';
    content += '<div class="form-group"><label>额外文件路径</label><input type="text" id="formExtraFiles" value="' + extraFiles + '" placeholder="文件或目录路径"></div>';
    content += '</div>';
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="draft"' + (status === 'draft' ? ' selected' : '') + '>草稿</option><option value="building"' + (status === 'building' ? ' selected' : '') + '>构建中</option><option value="completed"' + (status === 'completed' ? ' selected' : '') + '>已完成</option><option value="failed"' + (status === 'failed' ? ' selected' : '') + '>失败</option></select></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveItem()">保存</button>';
    content += '</div>';
    return content;
  }

  window.showAddModal = function() {
    var content = buildFormContent(null);
    var modal = showModal('新增PE定制', content);
    modal.setAttribute('data-mode', 'add');
    modal.setAttribute('data-id', '');
  };

  window.showEditModal = function(id) {
    api('/peCustomize/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var content = buildFormContent(item);
      var modal = showModal('编辑PE定制', content);
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) {
      toast('获取详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.saveItem = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';

    var data = getFormData();
    if (!data.name) {
      toast('请输入定制名称', 'error');
      return;
    }

    var request;
    if (mode === 'edit' && id) {
      request = api('/peCustomize/' + id, { method: 'PUT', body: data });
    } else {
      request = api('/peCustomize', { method: 'POST', body: data });
    }

    request.then(function(res) {
      if (res.code === 0) {
        toast(mode === 'edit' ? '更新成功' : '创建成功', 'success');
        closeModal();
        loadList();
      } else {
        toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.deleteItem = function(id) {
    if (!confirm('确定要删除该PE定制吗？此操作不可恢复。')) return;
    api('/peCustomize/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) {
        toast('删除成功', 'success');
        loadList();
      } else {
        toast(res.message || '删除失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.buildItem = function(id) {
    if (!confirm('确定要开始构建该PE定制吗？')) return;
    toast('正在提交构建任务...', 'info');
    api('/peCustomize/' + id + '/build', { method: 'POST' }).then(function(res) {
      if (res.code === 0) {
        toast('构建任务已提交', 'success');
        loadList();
      } else {
        toast(res.message || '构建失败', 'error');
      }
    }).catch(function(err) {
      toast('构建请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.downloadItem = function(id) {
    toast('正在准备下载...', 'info');
    var token = localStorage.getItem(TOKEN_KEY);
    var url = '/api/v1/peCustomize/' + id + '/download';
    window.open(url, '_blank');
  };

  window.viewDetail = function(id) {
    toast('正在加载详情...', 'info');
    api('/peCustomize/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var statusMap = { draft: '草稿', building: '构建中', completed: '已完成', failed: '失败' };
      var statusText = statusMap[item.status] || item.status;

      var tools = '';
      if (item.included_tools) {
        if (typeof item.included_tools === 'string') {
          try { tools = JSON.parse(item.included_tools).join(', '); } catch(e) { tools = item.included_tools; }
        } else if (Array.isArray(item.included_tools)) {
          tools = item.included_tools.join(', ');
        }
      }

      var content = '';
      content += '<div class="detail-grid">';
      content += '<div class="detail-item"><div class="dt-label">ID</div><div class="dt-value">' + esc(item.id) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">名称</div><div class="dt-value">' + esc(item.name) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">基础PE版本</div><div class="dt-value">' + esc(item.base_pe_version || '-') + '</div></div>';
      content += '<div class="detail-item detail-full"><div class="dt-label">包含工具</div><div class="dt-value">' + esc(tools || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">壁纸</div><div class="dt-value">' + esc(item.wallpaper || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">额外文件</div><div class="dt-value">' + esc(item.extra_files || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + statusBadge(item.status, statusText) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(item.created_at) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">更新时间</div><div class="dt-value">' + fmtDate(item.updated_at) + '</div></div>';
      content += '</div>';
      content += '<div class="form-actions" style="margin-top:16px;">';
      content += '<button class="btn-cancel" onclick="closeModal()">关闭</button>';
      content += '<button class="action-btn edit" style="padding:8px 20px;font-size:13px;" onclick="closeModal();showEditModal(' + item.id + ')">编辑</button>';
      if (item.status === 'draft' || item.status === 'failed') {
        content += '<button class="action-btn run" style="padding:8px 20px;font-size:13px;" onclick="closeModal();buildItem(' + item.id + ')">构建</button>';
      }
      if (item.status === 'completed') {
        content += '<button class="action-btn more" style="padding:8px 20px;font-size:13px;" onclick="closeModal();downloadItem(' + item.id + ')">下载</button>';
      }
      content += '</div>';

      showModal('PE定制详情 - ' + esc(item.name), content);
    }).catch(function(err) {
      toast('获取详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  loadList();

})();
</script>
</body>
</html>
