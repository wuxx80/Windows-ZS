<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回收站 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap;}
.clear-actions{display:flex;gap:8px;margin-left:auto;}
.deleted-content{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;font-size:12px;color:var(--text-light);}
.table-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:#f1f5f9;color:#64748b;}
</style>
</head>
<body>
<h2>回收站</h2>
<div class="search-bar">
  <button class="btn-reset" onclick="refreshList()" style="border-color:var(--primary);color:var(--primary);">刷新</button>
  <div class="clear-actions">
    <button class="btn-create" style="background:#dc2626;" onclick="clearAll()">清空回收站</button>
  </div>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:50px;">ID</th>
          <th style="width:100px;">原表</th>
          <th style="width:70px;">原ID</th>
          <th>删除内容</th>
          <th style="width:100px;">删除人</th>
          <th style="width:150px;">删除时间</th>
          <th style="width:160px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7"><div class="empty-state"><div class="empty-icon">🗑️</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">🗑️</div>
      <p>回收站为空</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>

<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];

  function loadData() {
    var params = "page=" + currentPage + "&pageSize=" + pageSize;

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "<tr><td colspan=\"7\" style=\"text-align:center;padding:40px;color:#94a3b8;\">加载中...</td></tr>";

    api("/recycleBin?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        tableBody.innerHTML = "<tr><td colspan=\"7\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>" + esc(res.message || "加载失败") + "</p></div></td></tr>";
      }
    }).catch(function(err) {
      tableBody.innerHTML = "<tr><td colspan=\"7\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>网络错误：" + esc(err.message) + "</p></div></td></tr>";
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var contentStr = "";
      if (item.deleted_content) {
        if (typeof item.deleted_content === "object") {
          contentStr = JSON.stringify(item.deleted_content);
        } else {
          contentStr = item.deleted_content;
        }
      }

      html += "<tr>";
      html += "<td>" + esc(item.id) + "</td>";
      html += "<td><span class=\"table-badge\">" + esc(item.original_table || "-") + "</span></td>";
      html += "<td>" + esc(item.original_id != null ? item.original_id : "-") + "</td>";
      html += "<td title=\"" + esc(contentStr) + "\"><span class=\"deleted-content\">" + esc(contentStr || "-") + "</span></td>";
      html += "<td>" + esc(item.deleted_by || "-") + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.deleted_at) + "</td>";
      html += "<td><div class=\"actions-cell\">";
      html += "<button class=\"action-btn run\" onclick=\"restoreItem(" + item.id + ")\">恢复</button>";
      html += "<button class=\"action-btn delete\" onclick=\"deleteItem(" + item.id + ")\">永久删除</button>";
      html += "</div></td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = "<div class=\"pagination\">";
    html += "<span class=\"page-info\">共 " + totalCount + " 条，第 " + currentPage + "/" + totalPages + " 页</span>";
    html += "<div class=\"page-btns\">";
    if (currentPage > 1) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(1)\">首页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage - 1) + ")\">上一页</button>";
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += "<button class=\"page-btn" + (i === currentPage ? " active" : "") + "\" onclick=\"goToPage(" + i + ")\">" + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage + 1) + ")\">下一页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + totalPages + ")\">末页</button>";
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadData();
  };

  window.refreshList = function() {
    currentPage = 1;
    loadData();
  };

  window.restoreItem = function(id) {
    if (!confirm("确定要恢复该记录吗？")) return;
    api("/recycleBin/" + id + "/restore", { method: "POST" }).then(function(res) {
      if (res.code === 0) {
        toast("恢复成功", "success");
        loadData();
      } else {
        toast(res.message || "恢复失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.deleteItem = function(id) {
    if (!confirm("确定要永久删除该记录吗？此操作不可恢复。")) return;
    api("/recycleBin/" + id, { method: "DELETE" }).then(function(res) {
      if (res.code === 0) {
        toast("已永久删除", "success");
        loadData();
      } else {
        toast(res.message || "删除失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.clearAll = function() {
    if (!confirm("确定要清空回收站吗？所有记录将被永久删除，此操作不可恢复。")) return;
    api("/recycleBin", { method: "DELETE" }).then(function(res) {
      if (res.code === 0) {
        toast("回收站已清空", "success");
        currentPage = 1;
        loadData();
      } else {
        toast(res.message || "清空失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  loadData();
})();
</script>
</body>
</html>
