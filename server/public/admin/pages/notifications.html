<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知消息 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.notification-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notification-unread{font-weight:600;background:#f8faff;}
.notification-unread td{color:var(--text);}
.notification-read td{color:var(--text-light);}
.badge-type{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;}
.badge-type.info{background:#dbeafe;color:#2563eb;}
.badge-type.warning{background:#fff7ed;color:#ea580c;}
.badge-type.error{background:#fef2f2;color:#dc2626;}
.badge-type.success{background:#dcfce7;color:#16a34a;}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap;}
</style>
</head>
<body>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
  <h2 style="margin:0;">通知消息</h2>
  <div style="display:flex;gap:8px;">
    <button class="btn-reset" onclick="markAllRead()">全部已读</button>
    <button class="btn-reset" onclick="refreshList()" style="border-color:var(--primary);color:var(--primary);">刷新</button>
  </div>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:40px;"><input type="checkbox" id="checkAll" onchange="toggleAllCheckbox()"></th>
          <th style="width:60px;">ID</th>
          <th>标题</th>
          <th>内容</th>
          <th style="width:70px;">类型</th>
          <th style="width:60px;">状态</th>
          <th style="width:140px;">时间</th>
          <th style="width:100px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🔔</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">🔔</div>
      <p>暂无通知消息</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>

<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];

  var TYPE_MAP = { "info": "info", "warning": "warning", "error": "error", "success": "success" };

  function getTypeBadge(type) {
    var cls = TYPE_MAP[type] || "info";
    var label = { "info": "信息", "warning": "警告", "error": "错误", "success": "成功" };
    return "<span class=\"badge-type " + cls + "\">" + (label[type] || type) + "</span>";
  }

  function getUnreadCount() {
    api("/notifications/unreadCount").then(function(res) {
      if (res.code === 0) {
        var badge = document.getElementById("unreadBadge");
        if (badge) badge.textContent = res.data.count > 0 ? res.data.count : "";
      }
    }).catch(function() {});
  }

  function loadData() {
    var params = "page=" + currentPage + "&pageSize=" + pageSize;

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "<tr><td colspan=\"8\" style=\"text-align:center;padding:40px;color:#94a3b8;\">加载中...</td></tr>";

    api("/notifications?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
        getUnreadCount();
      } else {
        tableBody.innerHTML = "<tr><td colspan=\"8\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>" + esc(res.message || "加载失败") + "</p></div></td></tr>";
      }
    }).catch(function(err) {
      tableBody.innerHTML = "<tr><td colspan=\"8\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>网络错误：" + esc(err.message) + "</p></div></td></tr>";
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var rowClass = item.is_read ? "notification-read" : "notification-unread";
      var checked = item._checked ? " checked" : "";
      html += "<tr class=\"" + rowClass + "\">";
      html += "<td><input type=\"checkbox\" class=\"notif-checkbox\" data-id=\"" + item.id + "\" onchange=\"onCheckboxChange()\"" + checked + "></td>";
      html += "<td>" + esc(item.id) + "</td>";
      html += "<td><strong>" + esc(item.title) + "</strong></td>";
      html += "<td class=\"notification-cell\">" + esc(item.content || "") + "</td>";
      html += "<td>" + getTypeBadge(item.type) + "</td>";
      html += "<td>" + (item.is_read ? "<span style=\"color:var(--text-light);font-size:12px;\">已读</span>" : "<span style=\"color:#2563eb;font-size:12px;font-weight:600;\">未读</span>") + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.created_at) + "</td>";
      html += "<td><div class=\"actions-cell\">";
      if (!item.is_read) {
        html += "<button class=\"action-btn edit\" onclick=\"markRead(" + item.id + ")\">标记已读</button>";
      } else {
        html += "<span style=\"font-size:12px;color:var(--text-light);\">-</span>";
      }
      html += "<button class=\"action-btn more\" onclick=\"viewNotification(" + item.id + ")\">查看</button>";
      html += "</div></td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = "<div class=\"pagination\">";
    html += "<span class=\"page-info\">共 " + totalCount + " 条，第 " + currentPage + "/" + totalPages + " 页</span>";
    html += "<div class=\"page-btns\">";
    if (currentPage > 1) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(1)\">首页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage - 1) + ")\">上一页</button>";
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += "<button class=\"page-btn" + (i === currentPage ? " active" : "") + "\" onclick=\"goToPage(" + i + ")\">" + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage + 1) + ")\">下一页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + totalPages + ")\">末页</button>";
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadData();
  };

  window.refreshList = function() {
    currentPage = 1;
    loadData();
  };

  window.toggleAllCheckbox = function() {
    var checked = document.getElementById("checkAll").checked;
    var boxes = document.querySelectorAll(".notif-checkbox");
    for (var i = 0; i < boxes.length; i++) {
      boxes[i].checked = checked;
    }
    onCheckboxChange();
  };

  window.onCheckboxChange = function() {
    var boxes = document.querySelectorAll(".notif-checkbox");
    var allChecked = true;
    var anyChecked = false;
    for (var i = 0; i < boxes.length; i++) {
      if (!boxes[i].checked) allChecked = false;
      else anyChecked = true;
    }
    document.getElementById("checkAll").checked = allChecked;
    var batchBtn = document.getElementById("batchReadBtn");
    if (batchBtn) batchBtn.style.display = anyChecked ? "inline-block" : "none";
  };

  window.markRead = function(id) {
    api("/notifications/" + id + "/read", { method: "POST" }).then(function(res) {
      if (res.code === 0) {
        toast("标记已读成功", "success");
        loadData();
      } else {
        toast(res.message || "操作失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.markAllRead = function() {
    var ids = [];
    for (var i = 0; i < currentList.length; i++) {
      if (!currentList[i].is_read) ids.push(currentList[i].id);
    }
    if (ids.length === 0) {
      toast("没有未读消息", "info");
      return;
    }
    api("/notifications/batchRead", { method: "POST", body: { ids: ids } }).then(function(res) {
      if (res.code === 0) {
        toast("全部标记已读成功", "success");
        loadData();
      } else {
        toast(res.message || "操作失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.viewNotification = function(id) {
    api("/notifications/" + id + "/read", { method: "POST" }).then(function() {}).catch(function() {});
    for (var i = 0; i < currentList.length; i++) {
      if (currentList[i].id === id) {
        var item = currentList[i];
        var content = "";
        content += "<div style=\"margin-bottom:16px;\">";
        content += "<div style=\"font-size:14px;font-weight:600;margin-bottom:8px;\">" + esc(item.title) + "</div>";
        content += "<div style=\"font-size:13px;color:var(--text-light);margin-bottom:4px;\">类型：" + getTypeBadge(item.type) + " &nbsp;|&nbsp; 时间：" + fmtDate(item.created_at) + "</div>";
        content += "</div>";
        content += "<div style=\"background:#f8fafc;border-radius:6px;padding:16px;font-size:14px;line-height:1.8;white-space:pre-wrap;\">" + esc(item.content || "无内容") + "</div>";
        content += "<div class=\"form-actions\"><button class=\"btn-cancel\" onclick=\"closeModal()\">关闭</button></div>";
        showModal("通知详情", content);
        loadData();
        return;
      }
    }
    toast("通知不存在", "error");
  };

  loadData();
})();
</script>
</body>
</html>
