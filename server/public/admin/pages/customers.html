<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap;}
</style>
</head>
<body>
<h2>客户管理</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索客户名称/公司/电话/邮箱" style="min-width:200px;">
  <button class="btn-search" onclick="searchCustomers()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">添加客户</button>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>客户名称</th>
          <th>公司</th>
          <th>电话</th>
          <th>邮箱</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:160px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="7"><div class="empty-state"><div class="empty-icon">&#x1F465;</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">&#x1F465;</div>
      <p>暂无客户数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>

<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];

  function loadData() {
    var keyword = document.getElementById("searchKeyword").value.trim();
    var params = "page=" + currentPage + "&pageSize=" + pageSize;
    if (keyword) params += "&keyword=" + encodeURIComponent(keyword);

    var tableBody = document.getElementById("tableBody");
    tableBody.innerHTML = "<tr><td colspan=\"7\" style=\"text-align:center;padding:40px;color:#94a3b8;\">加载中...</td></tr>";

    api("/customers?" + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        tableBody.innerHTML = "<tr><td colspan=\"7\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>" + esc(res.message || "加载失败") + "</p></div></td></tr>";
      }
    }).catch(function(err) {
      tableBody.innerHTML = "<tr><td colspan=\"7\"><div class=\"empty-state\"><div class=\"empty-icon\">&#x274C;</div><p>网络错误：" + esc(err.message) + "</p></div></td></tr>";
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById("tableBody");
    var emptyState = document.getElementById("emptyState");

    if (!list || list.length === 0) {
      tableBody.innerHTML = "";
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    var html = "";
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      html += "<tr>";
      html += "<td>" + esc(item.id) + "</td>";
      html += "<td><strong>" + esc(item.name) + "</strong></td>";
      html += "<td>" + esc(item.company || "-") + "</td>";
      html += "<td>" + esc(item.phone || "-") + "</td>";
      html += "<td>" + esc(item.email || "-") + "</td>";
      html += "<td style=\"font-size:12px;color:var(--text-light);\">" + fmtDate(item.created_at) + "</td>";
      html += "<td><div class=\"actions-cell\">";
      html += "<button class=\"action-btn edit\" onclick=\"editCustomer(" + item.id + ")\">编辑</button>";
      html += "<button class=\"action-btn delete\" onclick=\"deleteCustomer(" + item.id + ")\">删除</button>";
      html += "<button class=\"action-btn more\" onclick=\"viewCustomer(" + item.id + ")\">详情</button>";
      html += "</div></td>";
      html += "</tr>";
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById("paginationContainer");
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = "";
      return;
    }
    var html = "<div class=\"pagination\">";
    html += "<span class=\"page-info\">共 " + totalCount + " 条，第 " + currentPage + "/" + totalPages + " 页</span>";
    html += "<div class=\"page-btns\">";
    if (currentPage > 1) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(1)\">首页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage - 1) + ")\">上一页</button>";
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += "<button class=\"page-btn" + (i === currentPage ? " active" : "") + "\" onclick=\"goToPage(" + i + ")\">" + i + "</button>";
    }
    if (currentPage < totalPages) {
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + (currentPage + 1) + ")\">下一页</button>";
      html += "<button class=\"page-btn\" onclick=\"goToPage(" + totalPages + ")\">末页</button>";
    }
    html += "</div></div>";
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadData();
  };

  window.searchCustomers = function() {
    currentPage = 1;
    loadData();
  };

  window.resetSearch = function() {
    document.getElementById("searchKeyword").value = "";
    currentPage = 1;
    loadData();
  };

  function getFormData() {
    return {
      name: document.getElementById("formName").value.trim(),
      company: document.getElementById("formCompany").value.trim(),
      phone: document.getElementById("formPhone").value.trim(),
      email: document.getElementById("formEmail").value.trim(),
      address: document.getElementById("formAddress").value.trim(),
      remark: document.getElementById("formRemark").value.trim()
    };
  }

  function getFormContent(data) {
    var content = "";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>客户名称 <span style=\"color:#dc2626;\">*</span></label><input type=\"text\" id=\"formName\" placeholder=\"客户名称\" value=\"" + esc(data ? data.name : "") + "\"></div>";
    content += "<div class=\"form-group\"><label>公司</label><input type=\"text\" id=\"formCompany\" placeholder=\"公司名称\" value=\"" + esc(data ? data.company : "") + "\"></div>";
    content += "</div>";
    content += "<div class=\"form-row\">";
    content += "<div class=\"form-group\"><label>电话</label><input type=\"text\" id=\"formPhone\" placeholder=\"联系电话\" value=\"" + esc(data ? data.phone : "") + "\"></div>";
    content += "<div class=\"form-group\"><label>邮箱</label><input type=\"email\" id=\"formEmail\" placeholder=\"电子邮箱\" value=\"" + esc(data ? data.email : "") + "\"></div>";
    content += "</div>";
    content += "<div class=\"form-group\"><label>地址</label><input type=\"text\" id=\"formAddress\" placeholder=\"联系地址\" value=\"" + esc(data ? data.address : "") + "\"></div>";
    content += "<div class=\"form-group\"><label>备注</label><textarea id=\"formRemark\" placeholder=\"备注信息\">" + esc(data ? data.remark : "") + "</textarea></div>";
    content += "<div class=\"form-actions\">";
    content += "<button class=\"btn-cancel\" onclick=\"closeModal()\">取消</button>";
    content += "<button class=\"btn-submit\" onclick=\"saveCustomer()\">保存</button>";
    content += "</div>";
    return content;
  }

  window.showAddModal = function() {
    var content = getFormContent(null);
    var modal = showModal("添加客户", content);
    modal.setAttribute("data-mode", "add");
    modal.setAttribute("data-id", "");
  };

  window.editCustomer = function(id) {
    api("/customers/" + id).then(function(res) {
      if (res.code === 0) {
        var item = res.data;
        var content = getFormContent(item);
        var modal = showModal("编辑客户 - " + esc(item.name), content);
        modal.setAttribute("data-mode", "edit");
        modal.setAttribute("data-id", id);
      } else {
        toast(res.message || "获取客户信息失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.viewCustomer = function(id) {
    api("/customers/" + id).then(function(res) {
      if (res.code === 0) {
        var item = res.data;
        var content = "";
        content += "<div class=\"detail-grid\">";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">客户名称</div><div class=\"dt-value\">" + esc(item.name) + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">公司</div><div class=\"dt-value\">" + esc(item.company || "-") + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">电话</div><div class=\"dt-value\">" + esc(item.phone || "-") + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">邮箱</div><div class=\"dt-value\">" + esc(item.email || "-") + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">地址</div><div class=\"dt-value\">" + esc(item.address || "-") + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">备注</div><div class=\"dt-value\">" + esc(item.remark || "-") + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">创建时间</div><div class=\"dt-value\">" + fmtDate(item.created_at) + "</div></div>";
        content += "<div class=\"detail-item\"><div class=\"dt-label\">更新时间</div><div class=\"dt-value\">" + fmtDate(item.updated_at) + "</div></div>";
        content += "</div>";
        content += "<div class=\"form-actions\"><button class=\"btn-cancel\" onclick=\"closeModal()\">关闭</button></div>";
        showModal("客户详情 - " + esc(item.name), content);
      } else {
        toast(res.message || "获取客户信息失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.saveCustomer = function() {
    var modal = document.getElementById("modalOverlay");
    var mode = modal ? modal.getAttribute("data-mode") : "add";
    var id = modal ? parseInt(modal.getAttribute("data-id"), 10) : 0;

    var data = getFormData();
    if (!data.name) {
      toast("请输入客户名称", "error");
      return;
    }

    var url = "/customers";
    var method = "POST";
    if (mode === "edit") {
      url = "/customers/" + id;
      method = "PUT";
    }

    api(url, { method: method, body: data }).then(function(res) {
      if (res.code === 0) {
        toast(mode === "add" ? "客户添加成功" : "客户更新成功", "success");
        closeModal();
        loadData();
      } else {
        toast(res.message || "操作失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  window.deleteCustomer = function(id) {
    if (!confirm("确定要删除该客户吗？此操作不可恢复。")) return;
    api("/customers/" + id, { method: "DELETE" }).then(function(res) {
      if (res.code === 0) {
        toast("客户删除成功", "success");
        loadData();
      } else {
        toast(res.message || "删除失败", "error");
      }
    }).catch(function(err) {
      toast("网络错误：" + err.message, "error");
    });
  };

  loadData();
})();
</script>
</body>
</html>
