<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.version-cell{font-family:'Consolas','Monaco',monospace;font-weight:600;font-size:13px;}
.platform-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500;}
.platform-badge.windows{background:#dbeafe;color:#2563eb;}
.platform-badge.linux{background:#fff7ed;color:#ea580c;}
.platform-badge.macos{background:#f3e8ff;color:#9333ea;}
.changelog-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-light);font-size:13px;}
.url-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Consolas','Monaco',monospace;font-size:12px;color:var(--text-light);}
</style>
</head>
<body>
<h2>版本管理</h2>
<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="搜索版本号" style="min-width:200px;">
  <select id="searchPlatform">
    <option value="">全部平台</option>
    <option value="windows">Windows</option>
    <option value="linux">Linux</option>
    <option value="macos">macOS</option>
  </select>
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="draft">草稿</option>
    <option value="published">已发布</option>
    <option value="archived">已归档</option>
  </select>
  <button class="btn-search" onclick="searchVersions()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">添加版本</button>
</div>
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th style="width:100px;">版本号</th>
          <th style="width:80px;">平台</th>
          <th style="width:90px;">文件大小</th>
          <th style="width:220px;">下载地址</th>
          <th>更新日志</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:200px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📦</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">📦</div>
      <p>暂无版本数据</p>
    </div>
  </div>
</div>
<div id="paginationContainer"></div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalCount = 0;
  var currentList = [];
  var PLATFORM_MAP = { 'windows': 'Windows', 'linux': 'Linux', 'macos': 'macOS' };
  var STATUS_MAP = { 'draft': '草稿', 'published': '已发布', 'archived': '已归档' };
  function loadList() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var platform = document.getElementById('searchPlatform').value;
    var status = document.getElementById('searchStatus').value;
    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (platform) params += '&platform=' + encodeURIComponent(platform);
    if (status) params += '&status=' + encodeURIComponent(status);
    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';
    api('/clientVersions?' + params).then(function(res) {
      if (res.code === 0) {
        totalCount = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }
  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');
    if (!list || list.length === 0) { tableBody.innerHTML = ''; emptyState.style.display = 'block'; return; }
    emptyState.style.display = 'none';
    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var platformLabel = PLATFORM_MAP[item.platform] || item.platform || '-';
      var platformClass = item.platform || 'windows';
      var statusLabel = STATUS_MAP[item.status] || item.status || '-';
      html += '<tr>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><span class="version-cell">' + esc(item.version) + '</span></td>';
      html += '<td><span class="platform-badge ' + platformClass + '">' + esc(platformLabel) + '</span></td>';
      html += '<td>' + fmtSize(item.file_size) + '</td>';
      html += '<td><div class="url-cell" title="' + esc(item.download_url || '') + '">' + esc(item.download_url || '-') + '</div></td>';
      html += '<td><div class="changelog-cell" title="' + esc(item.changelog || '') + '">' + esc(item.changelog || '-') + '</div></td>';
      html += '<td>' + statusBadge(item.status, statusLabel) + '</td>';
      html += '<td style="font-size:12px;color:var(--text-light);">' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      if (item.status === 'draft' || item.status === 'archived') { html += '<button class="action-btn run" onclick="publishVersion(' + item.id + ')">发布</button>'; }
      html += '<button class="action-btn edit" onclick="showEditModal(' + item.id + ')">编辑</button>';
      html += '<button class="action-btn delete" onclick="deleteVersion(' + item.id + ')">删除</button>';
      html += '</td></tr>';
    }
    tableBody.innerHTML = html;
  }
  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalCount / pageSize);
    if (totalPages <= 1) { container.innerHTML = ''; return; }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalCount + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) { html += '<button class="page-btn" onclick="goToPage(1)">首页</button>'; html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>'; }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) { html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>'; }
    if (currentPage < totalPages) { html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>'; html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>'; }
    html += '</div></div>';
    container.innerHTML = html;
  }
  window.goToPage = function(page) { currentPage = page; loadList(); };
  window.searchVersions = function() { currentPage = 1; loadList(); };
  window.resetSearch = function() { document.getElementById('searchKeyword').value = ''; document.getElementById('searchPlatform').value = ''; document.getElementById('searchStatus').value = ''; currentPage = 1; loadList(); };
  function buildFormHtml(item) {
    var version = item ? esc(item.version) : '';
    var platform = item ? item.platform : 'windows';
    var fileSize = item ? (item.file_size || '') : '';
    var downloadUrl = item ? esc(item.download_url || '') : '';
    var changelog = item ? esc(item.changelog || '') : '';
    var status = item ? item.status : 'draft';
    var platforms = ['windows', 'linux', 'macos'];
    var platformOpts = '';
    for (var i = 0; i < platforms.length; i++) { platformOpts += '<option value="' + platforms[i] + '"' + (platform === platforms[i] ? ' selected' : '') + '>' + esc(PLATFORM_MAP[platforms[i]]) + '</option>'; }
    var content = '';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>版本号 <span style="color:#dc2626;">*</span></label><input type="text" id="formVersion" value="' + version + '" placeholder="如: 1.0.0"></div>';
    content += '<div class="form-group"><label>平台</label><select id="formPlatform">' + platformOpts + '</select></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>文件大小 (字节)</label><input type="number" id="formFileSize" value="' + fileSize + '" placeholder="0" min="0"></div>';
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="draft"' + (status === 'draft' ? ' selected' : '') + '>草稿</option><option value="published"' + (status === 'published' ? ' selected' : '') + '>已发布</option><option value="archived"' + (status === 'archived' ? ' selected' : '') + '>已归档</option></select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>下载地址</label><input type="url" id="formDownloadUrl" value="' + downloadUrl + '" placeholder="https://example.com/client-setup.exe"></div>';
    content += '<div class="form-group"><label>更新日志</label><textarea id="formChangelog" rows="4" placeholder="请输入更新内容">' + changelog + '</textarea></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveVersion()">保存</button>';
    content += '</div>';
    return content;
  }
  window.showAddModal = function() { var modal = showModal('添加版本', buildFormHtml(null)); modal.setAttribute('data-mode', 'add'); modal.setAttribute('data-id', ''); };
  window.showEditModal = function(id) {
    api('/clientVersions/' + id).then(function(res) {
      if (res.code !== 0) { toast(res.message || '获取详情失败', 'error'); return; }
      var item = res.data;
      var modal = showModal('编辑版本 - ' + esc(item.version), buildFormHtml(item));
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) { toast('获取详情失败: ' + (err.message || '未知错误'), 'error'); });
  };
  window.saveVersion = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';
    var version = document.getElementById('formVersion').value.trim();
    var platform = document.getElementById('formPlatform').value;
    var fileSize = document.getElementById('formFileSize').value;
    var downloadUrl = document.getElementById('formDownloadUrl').value.trim();
    var changelog = document.getElementById('formChangelog').value.trim();
    var status = document.getElementById('formStatus').value;
    if (!version) { toast('请输入版本号', 'error'); return; }
    var body = { version: version, platform: platform, file_size: fileSize ? parseInt(fileSize, 10) : 0, download_url: downloadUrl, changelog: changelog, status: status };
    var request;
    if (mode === 'edit' && id) { request = api('/clientVersions/' + id, { method: 'PUT', body: body }); }
    else { request = api('/clientVersions', { method: 'POST', body: body }); }
    request.then(function(res) {
      if (res.code === 0) { toast(mode === 'edit' ? '更新成功' : '创建成功', 'success'); closeModal(); loadList(); }
      else { toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error'); }
    }).catch(function(err) { toast('网络请求失败: ' + (err.message || '未知错误'), 'error'); });
  };
  window.deleteVersion = function(id) {
    if (!confirm('确定要删除该版本吗？此操作不可恢复。')) return;
    api('/clientVersions/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) { toast('删除成功', 'success'); loadList(); }
      else { toast(res.message || '删除失败', 'error'); }
    }).catch(function(err) { toast('网络请求失败: ' + (err.message || '未知错误'), 'error'); });
  };
  window.publishVersion = function(id) {
    if (!confirm('确定要发布该版本吗？发布后客户端将能检测到更新。')) return;
    toast('正在发布...', 'info');
    api('/clientVersions/' + id + '/publish', { method: 'POST' }).then(function(res) {
      if (res.code === 0) { toast('发布成功', 'success'); loadList(); }
      else { toast(res.message || '发布失败', 'error'); }
    }).catch(function(err) { toast('网络请求失败: ' + (err.message || '未知错误'), 'error'); });
  };
  loadList();
})();
</script>
</body>
</html>
