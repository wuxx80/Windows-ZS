<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任务列表 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body { padding: 24px; background: transparent; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h2 { font-size: 20px; font-weight: 600; margin: 0; }
.search-bar .search-date { display: flex; align-items: center; gap: 4px; }
.search-bar .search-date input { min-width: 140px; }
.progress-bar { display: inline-flex; align-items: center; gap: 6px; }
.progress-bar .progress-track { width: 80px; height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
.progress-bar .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }
.progress-bar .progress-fill.completed { background: #16a34a; }
.progress-bar .progress-fill.failed { background: #dc2626; }
.progress-bar .progress-text { font-size: 12px; color: var(--text-light); min-width: 32px; }
.actions-cell { display: flex; gap: 4px; flex-wrap: wrap; }
.action-btn.log { background: #f3e8ff; color: #9333ea; }
.action-btn.log:hover { background: #e9d5ff; }
.action-btn.cancel { background: #fef2f2; color: #dc2626; }
.action-btn.cancel:hover { background: #fecaca; }
.action-btn.retry { background: #fff7ed; color: #ea580c; }
.action-btn.retry:hover { background: #fed7aa; }
.action-btn.pause { background: #fef9c3; color: #a16207; }
.action-btn.pause:hover { background: #fde68a; }
.action-btn.resume { background: #dcfce7; color: #16a34a; }
.action-btn.resume:hover { background: #bbf7d0; }
.modal-body-section { margin-bottom: 16px; }
.modal-body-section h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.detail-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.logs-container { max-height: 300px; overflow-y: auto; background: #1e293b; color: #e2e8f0; border-radius: 6px; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.6; }
.logs-container .log-entry { padding: 2px 0; }
.logs-container .log-entry .log-time { color: #94a3b8; }
.logs-container .log-entry .log-level { display: inline-block; padding: 0 4px; border-radius: 2px; font-size: 11px; font-weight: 600; margin: 0 4px; }
.logs-container .log-entry .log-level.info { color: #60a5fa; }
.logs-container .log-entry .log-level.warn { color: #fbbf24; }
.logs-container .log-entry .log-level.error { color: #f87171; }
.logs-container .log-entry .log-level.debug { color: #a78bfa; }
</style>
</head>
<body>
<div class="page-header">
  <h2>任务列表</h2>
</div>

<!-- Search Bar -->
<div class="search-bar" id="searchBar">
  <input type="text" id="searchKeyword" placeholder="搜索关键词..." style="min-width:160px;">
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="pending">待处理</option>
    <option value="running">运行中</option>
    <option value="completed">已完成</option>
    <option value="failed">失败</option>
    <option value="cancelled">已取消</option>
  </select>
  <div class="search-date">
    <input type="date" id="searchStartDate" placeholder="开始日期">
    <span>至</span>
    <input type="date" id="searchEndDate" placeholder="结束日期">
  </div>
  <button class="btn-search" onclick="searchTasks()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showCreateModal()">+ 新增任务</button>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="taskTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>任务编号</th>
          <th style="width:80px;">状态</th>
          <th style="width:130px;">进度</th>
          <th style="width:120px;">客户端</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:200px;">操作</th>
        </tr>
      </thead>
      <tbody id="taskBody">
        <tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Pagination -->
<div id="pagination"></div>

<!-- Create Task Modal -->
<div id="createModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>新增任务</span>
      <button onclick="closeCreateModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;">
      <div class="form-row">
        <div class="form-group">
          <label>客户端ID</label>
          <input type="number" id="createClientId" placeholder="客户端数据库ID（可留空）">
        </div>
        <div class="form-group">
          <label>镜像ID <span style="color:#dc2626;">*</span></label>
          <input type="number" id="createImageId" placeholder="镜像ID（必填）">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>目标磁盘</label>
          <input type="number" id="createDiskIndex" value="0" placeholder="磁盘索引">
        </div>
        <div class="form-group">
          <label>目标分区</label>
          <input type="text" id="createPartition" value="C:" placeholder="分区盘符">
        </div>
      </div>
      <div class="form-group">
        <label>分区方案</label>
        <select id="createPartitionScheme">
          <option value="auto">自动分区</option>
          <option value="custom">自定义分区</option>
          <option value="keep">保留现有分区</option>
        </select>
      </div>
      <div class="form-group">
        <label>其他参数（JSON格式，可选）</label>
        <textarea id="createParams" placeholder='{"type": "install"}' style="min-height:60px;"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeCreateModal()">取消</button>
        <button class="btn-submit" onclick="submitCreateTask()">创建任务</button>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>任务详情</span>
      <button onclick="closeDetailModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;" id="detailModalBody">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<!-- Logs Modal -->
<div id="logsModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>任务日志</span>
      <button onclick="closeLogsModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;">
      <div id="logsModalHeader" style="margin-bottom:12px;font-size:13px;color:var(--text-light);"></div>
      <div class="logs-container" id="logsContainer">
        <div style="text-align:center;color:#94a3b8;padding:20px;">加载中...</div>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/admin-common.js"></script>
<script>
// ========== State ==========
var currentPage = 1;
var pageSize = 15;
var totalCount = 0;

// ========== Load Tasks ==========
function loadTasks() {
  var keyword = document.getElementById('searchKeyword').value;
  var status = document.getElementById('searchStatus').value;
  var startDate = document.getElementById('searchStartDate').value;
  var endDate = document.getElementById('searchEndDate').value;
  var params = [];
  params.push('page=' + currentPage);
  params.push('pageSize=' + pageSize);
  if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
  if (status) params.push('status=' + encodeURIComponent(status));
  if (startDate) params.push('start_date=' + encodeURIComponent(startDate));
  if (endDate) params.push('end_date=' + encodeURIComponent(endDate));
  var tbody = document.getElementById('taskBody');
  tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">⏳</div><p>加载中...</p></div></td></tr>';
  api('/tasks?' + params.join('&')).then(function(res) {
    if (res.code === 0) {
      renderTasks(res.data);
    } else {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">❌</div><p>' + esc(res.message || '加载失败') + '</p></div></td></tr>';
    }
  }).catch(function(err) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">❌</div><p>网络错误：' + esc(err.message) + '</p></div></td></tr>';
  });
}
function renderTasks(data) {
  var list = data.list || [];
  totalCount = data.total || 0;
  var tbody = document.getElementById('taskBody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">📋</div><p>暂无任务数据</p></div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var statusHtml = statusBadge(item.status, item.status);
    var progressHtml = renderProgress(item.progress, item.status);
    var actionsHtml = buildActions(item);
    html += '<tr>' +
      '<td>' + esc(item.id) + '</td>' +
      '<td><a href="javascript:void(0)" onclick="showDetail(\'' + item.id + '\')" style="color:var(--primary);text-decoration:none;font-weight:500;">' + esc(item.task_no || item.id) + '</a></td>' +
      '<td>' + statusHtml + '</td>' +
      '<td>' + progressHtml + '</td>' +
      '<td style="font-size:12px;">' + esc(item.client_id) + '</td>' +
      '<td style="font-size:12px;color:var(--text-light);">' + fmtDate(item.created_at) + '</td>' +
      '<td><div class="actions-cell">' + actionsHtml + '</div></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
  var paginationHtml = renderPagination(totalCount, currentPage, pageSize, 'goToPage');
  document.getElementById('pagination').innerHTML = paginationHtml;
  var pageBtns = document.querySelectorAll('#pagination .page-btn');
  for (var j = 0; j < pageBtns.length; j++) {
    (function(btn) {
      btn.onclick = function() {
        var page = parseInt(this.getAttribute('data-page'));
        if (page && page !== currentPage) {
          currentPage = page;
          loadTasks();
        }
      };
    })(pageBtns[j]);
  }
}

function goToPage(page) {
  currentPage = page;
  loadTasks();
}

function renderProgress(progress, status) {
  if (status === 'pending') return '<span style="font-size:12px;color:var(--text-light);">等待中</span>';
  if (status === 'completed') {
    return '<div class="progress-bar"><div class="progress-track"><div class="progress-fill completed" style="width:100%;"></div></div><span class="progress-text">100%</span></div>';
  }
  if (status === 'failed') {
    return '<div class="progress-bar"><div class="progress-track"><div class="progress-fill failed" style="width:' + (progress || 0) + '%;"></div></div><span class="progress-text">' + (progress || 0) + '%</span></div>';
  }
  if (status === 'cancelled') return '<span style="font-size:12px;color:var(--text-light);">已取消</span>';
  var p = progress || 0;
  var cls = p >= 100 ? 'completed' : '';
  return '<div class="progress-bar"><div class="progress-track"><div class="progress-fill ' + cls + '" style="width:' + p + '%;"></div></div><span class="progress-text">' + p + '%</span></div>';
}

function buildActions(item) {
  var actions = '';
  var id = item.id;
  actions += '<button class="action-btn edit" onclick="showDetail(\'' + id + '\')">详情</button>';
  if (item.status === 'pending' || item.status === 'running') {
    actions += '<button class="action-btn cancel" onclick="cancelTask(\'' + id + '\')">取消</button>';
  }
  if (item.status === 'failed' || item.status === 'cancelled') {
    actions += '<button class="action-btn retry" onclick="retryTask(\'' + id + '\')">重试</button>';
  }
  if (item.status === 'running') {
    actions += '<button class="action-btn pause" onclick="pauseTask(\'' + id + '\')">暂停</button>';
  }
  if (item.status === 'paused') {
    actions += '<button class="action-btn resume" onclick="resumeTask(\'' + id + '\')">继续</button>';
  }
  actions += '<button class="action-btn log" onclick="showLogs(\'' + id + '\', \'' + esc(item.task_no || item.id) + '\')">日志</button>';
  return actions;
}

function searchTasks() {
  currentPage = 1;
  loadTasks();
}

function resetSearch() {
  document.getElementById('searchKeyword').value = '';
  document.getElementById('searchStatus').value = '';
  document.getElementById('searchStartDate').value = '';
  document.getElementById('searchEndDate').value = '';
  currentPage = 1;
  loadTasks();
}

function showCreateModal() {
  document.getElementById('createModalOverlay').style.display = 'flex';
  document.getElementById('createClientId').value = '';
  document.getElementById('createImageId').value = '';
  document.getElementById('createDiskIndex').value = '0';
  document.getElementById('createPartition').value = 'C:';
  document.getElementById('createPartitionScheme').value = 'auto';
  document.getElementById('createParams').value = '';
}

function closeCreateModal() {
  document.getElementById('createModalOverlay').style.display = 'none';
}

function submitCreateTask() {
  var imageId = document.getElementById('createImageId').value.trim();
  if (!imageId) {
    toast('请输入镜像ID', 'error');
    return;
  }
  var body = {
    image_id: imageId,
    target_disk_index: document.getElementById('createDiskIndex').value || 0,
    target_partition: document.getElementById('createPartition').value || 'C:',
    partition_scheme: document.getElementById('createPartitionScheme').value
  };
  var clientId = document.getElementById('createClientId').value.trim();
  if (clientId) body.client_id = clientId;
  var paramsStr = document.getElementById('createParams').value.trim();
  if (paramsStr) {
    try { body.options = JSON.parse(paramsStr); } catch (e) {
      toast('参数格式错误，请输入合法的JSON', 'error');
      return;
    }
  }
  api('/tasks', { method: 'POST', body: body }).then(function(res) {
    if (res.code === 0) {
      toast('任务创建成功', 'success');
      closeCreateModal();
      loadTasks();
    } else {
      toast(res.message || '创建失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}
function cancelTask(id) {
  if (!confirm('确定要取消该任务吗？')) return;
  api('/tasks/' + id + '/cancel', { method: 'POST' }).then(function(res) {
    if (res.code === 0) { toast('任务已取消', 'success'); loadTasks(); }
    else { toast(res.message || '取消失败', 'error'); }
  }).catch(function(err) { toast('网络错误：' + err.message, 'error'); });
}

function retryTask(id) {
  if (!confirm('确定要重试该任务吗？')) return;
  api('/tasks/' + id + '/retry', { method: 'POST' }).then(function(res) {
    if (res.code === 0) { toast('任务已重新提交', 'success'); loadTasks(); }
    else { toast(res.message || '重试失败', 'error'); }
  }).catch(function(err) { toast('网络错误：' + err.message, 'error'); });
}

function pauseTask(id) {
  if (!confirm('确定要暂停该任务吗？')) return;
  api('/tasks/' + id + '/pause', { method: 'POST' }).then(function(res) {
    if (res.code === 0) { toast('任务已暂停', 'success'); loadTasks(); }
    else { toast(res.message || '暂停失败', 'error'); }
  }).catch(function(err) { toast('网络错误：' + err.message, 'error'); });
}

function resumeTask(id) {
  if (!confirm('确定要恢复该任务吗？')) return;
  api('/tasks/' + id + '/resume', { method: 'POST' }).then(function(res) {
    if (res.code === 0) { toast('任务已恢复', 'success'); loadTasks(); }
    else { toast(res.message || '恢复失败', 'error'); }
  }).catch(function(err) { toast('网络错误：' + err.message, 'error'); });
}

function showDetail(id) {
  var overlay = document.getElementById('detailModalOverlay');
  var body = document.getElementById('detailModalBody');
  body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">加载中...</div>';
  overlay.style.display = 'flex';
  api('/tasks/' + id).then(function(res) {
    if (res.code === 0) { renderDetail(res.data); }
    else { body.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">' + esc(res.message || '加载失败') + '</div>'; }
  }).catch(function(err) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">网络错误：' + esc(err.message) + '</div>';
  });
}

function renderDetail(data) {
  var item = data.task || data;
  var client = data.client || null;
  var logs = data.logs || [];
  var html = '';
  html += '<div class="modal-body-section"><h4>基本信息</h4><div class="detail-grid">';
  html += '<div class="detail-item"><div class="dt-label">任务ID</div><div class="dt-value">' + esc(item.id) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">任务编号</div><div class="dt-value">' + esc(item.task_no || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + statusBadge(item.status, item.status) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">进度</div><div class="dt-value">' + (item.progress || 0) + '%</div></div>';
  html += '<div class="detail-item"><div class="dt-label">客户端ID</div><div class="dt-value">' + esc(item.client_id || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">镜像ID</div><div class="dt-value">' + esc(item.image_id || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">目标磁盘</div><div class="dt-value">' + esc(item.target_disk_index === undefined || item.target_disk_index === null ? '-' : item.target_disk_index) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">目标分区</div><div class="dt-value">' + esc(item.target_partition || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">分区方案</div><div class="dt-value">' + esc(item.partition_scheme || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(item.created_at) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">开始时间</div><div class="dt-value">' + fmtDate(item.started_at) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">完成时间</div><div class="dt-value">' + fmtDate(item.completed_at) + '</div></div>';
  html += '</div></div>';
  if (item.options) {
    html += '<div class="modal-body-section"><h4>任务参数</h4>';
    var paramsStr = typeof item.options === 'object' ? JSON.stringify(item.options, null, 2) : String(item.options);
    html += '<pre style="background:#f8f9fa;padding:12px;border-radius:6px;font-size:12px;overflow-x:auto;max-height:200px;">' + esc(paramsStr) + '</pre></div>';
  }
  if (client) {
    html += '<div class="modal-body-section"><h4>关联客户端</h4><div class="detail-grid">';
    html += '<div class="detail-item"><div class="dt-label">客户端ID</div><div class="dt-value">' + esc(client.id || '-') + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">客户端名称</div><div class="dt-value">' + esc(client.name || client.hostname || '-') + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">IP地址</div><div class="dt-value">' + esc(client.ip || client.last_ip || '-') + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + (client.status ? statusBadge(client.status, client.status) : '-') + '</div></div>';
    html += '</div></div>';
  }
  if (logs.length > 0) {
    html += '<div class="modal-body-section"><h4>最近日志</h4><div class="logs-container" style="max-height:150px;">';
    for (var i = 0; i < Math.min(logs.length, 20); i++) {
      var log = logs[i];
      var levelClass = (log.level || 'info').toLowerCase();
      html += '<div class="log-entry"><span class="log-time">[' + fmtDate(log.created_at || log.time) + ']</span><span class="log-level ' + levelClass + '">' + esc(log.level || 'INFO') + '</span>' + esc(log.message) + '</div>';
    }
    html += '</div></div>';
  }
  html += '<div class="form-actions" style="border-top:1px solid var(--border);">';
  if (item.status === 'pending' || item.status === 'running') {
    html += '<button class="action-btn cancel" style="padding:6px 16px;font-size:13px;" onclick="cancelTaskFromDetail(\'' + item.id + '\')">取消任务</button>';
  }
  if (item.status === 'failed' || item.status === 'cancelled') {
    html += '<button class="action-btn retry" style="padding:6px 16px;font-size:13px;" onclick="retryTaskFromDetail(\'' + item.id + '\')">重试任务</button>';
  }
  if (item.status === 'running') {
    html += '<button class="action-btn pause" style="padding:6px 16px;font-size:13px;" onclick="pauseTaskFromDetail(\'' + item.id + '\')">暂停任务</button>';
  }
  if (item.status === 'paused') {
    html += '<button class="action-btn resume" style="padding:6px 16px;font-size:13px;" onclick="resumeTaskFromDetail(\'' + item.id + '\')">恢复任务</button>';
  }
  html += '<button class="action-btn log" style="padding:6px 16px;font-size:13px;" onclick="showLogsFromDetail(\'' + item.id + '\', \'' + esc(item.task_no || item.id) + '\')">查看日志</button>';
  html += '<button class="btn-cancel" onclick="closeDetailModal()" style="padding:6px 16px;font-size:13px;">关闭</button>';
  html += '</div>';
  document.getElementById('detailModalBody').innerHTML = html;
}

function closeDetailModal() {
  document.getElementById('detailModalOverlay').style.display = 'none';
}

function cancelTaskFromDetail(id) { closeDetailModal(); cancelTask(id); }
function retryTaskFromDetail(id) { closeDetailModal(); retryTask(id); }
function pauseTaskFromDetail(id) { closeDetailModal(); pauseTask(id); }
function resumeTaskFromDetail(id) { closeDetailModal(); resumeTask(id); }
function showLogsFromDetail(id, name) { closeDetailModal(); showLogs(id, name); }

function showLogs(id, name) {
  var overlay = document.getElementById('logsModalOverlay');
  var container = document.getElementById('logsContainer');
  var header = document.getElementById('logsModalHeader');
  header.textContent = '任务：' + (name || id);
  container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">加载中...</div>';
  overlay.style.display = 'flex';
  api('/tasks/' + id + '/logs').then(function(res) {
    if (res.code === 0) { renderLogs(res.data); }
    else { container.innerHTML = '<div style="text-align:center;color:#f87171;padding:20px;">' + esc(res.message || '加载失败') + '</div>'; }
  }).catch(function(err) {
    container.innerHTML = '<div style="text-align:center;color:#f87171;padding:20px;">网络错误：' + esc(err.message) + '</div>';
  });
}

function renderLogs(data) {
  var list = data;
  if (!Array.isArray(list)) {
    if (data && data.list) list = data.list;
    else if (data && data.logs) list = data.logs;
    else list = [];
  }
  var container = document.getElementById('logsContainer');
  if (list.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:20px;">暂无日志记录</div>';
    return;
  }
  var levelMap = { 'completed': 'info', 'running': 'info', 'pending': 'info', 'failed': 'error', 'error': 'error', 'warn': 'warn', 'debug': 'debug' };
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var log = list[i];
    var rawLevel = log.level || log.status || 'info';
    var level = (levelMap[String(rawLevel).toLowerCase()] || 'info');
    var time = fmtDate(log.created_at || log.time || log.timestamp);
    var step = log.step_name ? '[' + esc(log.step_name) + '] ' : '';
    var prog = (typeof log.progress === 'number' && log.progress > 0) ? ' (' + log.progress + '%)' : '';
    var msg = log.message || log.msg || '';
    html += '<div class="log-entry"><span class="log-time">[' + time + ']</span><span class="log-level ' + level + '">' + esc(level.toUpperCase()) + '</span>' + step + esc(msg) + prog + '</div>';
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function closeLogsModal() {
  document.getElementById('logsModalOverlay').style.display = 'none';
}

loadTasks();
</script>
</body>
</html>
