<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;}
h2{margin-bottom:20px;font-size:20px;font-weight:600;color:#334155;}
.settings-section{margin-bottom:24px;}
.settings-section .section-header{padding:14px 20px;background:var(--white);border-radius:8px 8px 0 0;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);}
.settings-section .section-body{background:var(--white);border-radius:0 0 8px 8px;padding:16px 20px;box-shadow:var(--shadow);}
.setting-item{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f1f5f9;}
.setting-item:last-child{border-bottom:none;}
.setting-item .setting-info{flex:1;min-width:0;}
.setting-item .setting-info .setting-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:2px;}
.setting-item .setting-info .setting-desc{font-size:12px;color:var(--text-light);}
.setting-item .setting-control{flex-shrink:0;margin-left:16px;min-width:200px;}
.setting-item .setting-control input[type="text"],.setting-item .setting-control input[type="number"],.setting-item .setting-control select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;outline:none;width:200px;transition:border-color 0.2s;}
.setting-item .setting-control input:focus,.setting-item .setting-control select:focus{border-color:var(--primary);}
.setting-item .setting-control .btn-save-setting{padding:6px 16px;background:var(--primary);color:var(--white);border:none;border-radius:6px;font-size:12px;cursor:pointer;transition:background 0.2s;white-space:nowrap;}
.setting-item .setting-control .btn-save-setting:hover{background:var(--primary-dark);}
.setting-item .setting-control .toggle-switch{position:relative;display:inline-block;width:44px;height:24px;vertical-align:middle;}
.setting-item .setting-control .toggle-switch input{opacity:0;width:0;height:0;}
.setting-item .setting-control .toggle-switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#cbd5e1;transition:0.3s;border-radius:24px;}
.setting-item .setting-control .toggle-switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;transition:0.3s;border-radius:50%;}
.setting-item .setting-control .toggle-switch input:checked + .slider{background:var(--primary);}
.setting-item .setting-control .toggle-switch input:checked + .slider:before{transform:translateX(20px);}
.setting-item .setting-control .setting-value-text{font-size:13px;color:var(--text-light);margin-right:8px;}
</style>
</head>
<body>
<h2>系统设置</h2>
<div id="settingsContainer"></div>
<div style="text-align:center;padding:20px;color:var(--text-light);" id="loadingState">加载中...</div>
<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var LOCAL_KEY = "zs_admin_settings";
  var currentSettings = {};

  var settingGroups = [
    {
      key: "basic",
      title: "基本设置",
      icon: "⚙️",
      items: [
        { key: "site_name", label: "站点名称", desc: "管理后台显示的站点名称", type: "text", default: "ZS 装机助手" },
        { key: "site_url", label: "站点地址", desc: "系统访问地址，用于生成链接", type: "text", default: "http://localhost:3000" },
        { key: "admin_email", label: "管理员邮箱", desc: "系统通知接收邮箱", type: "text", default: "admin@zs.com" },
        { key: "page_size", label: "每页条数", desc: "列表页面默认每页显示数量", type: "number", default: "15" },
        { key: "language", label: "系统语言", desc: "界面显示语言", type: "select", default: "zh-CN", options: [{value:"zh-CN",label:"简体中文"},{value:"en",label:"English"}] }
      ]
    },
    {
      key: "image",
      title: "镜像设置",
      icon: "💿",
      items: [
        { key: "image_storage_path", label: "镜像存储路径", desc: "镜像文件存放的本地目录", type: "text", default: "/data/images" },
        { key: "image_cache_size", label: "镜像缓存大小 (GB)", desc: "本地缓存镜像的最大磁盘占用", type: "number", default: "100" },
        { key: "auto_verify", label: "自动验证", desc: "上传镜像后自动进行完整性验证", type: "switch", default: "true" },
        { key: "allowed_formats", label: "允许格式", desc: "允许上传的镜像文件格式", type: "text", default: "wim,iso,gho,esd" },
        { key: "max_file_size", label: "最大文件大小 (MB)", desc: "单个镜像文件上传大小限制", type: "number", default: "10240" }
      ]
    },
    {
      key: "task",
      title: "任务设置",
      icon: "📋",
      items: [
        { key: "task_timeout", label: "任务超时 (分钟)", desc: "单个任务最大执行时间，超时自动取消", type: "number", default: "120" },
        { key: "max_concurrent_tasks", label: "最大并发任务数", desc: "系统同时执行的最大任务数量", type: "number", default: "5" },
        { key: "auto_retry", label: "自动重试", desc: "任务失败后自动重试", type: "switch", default: "true" },
        { key: "retry_max_count", label: "最大重试次数", desc: "任务失败自动重试的最大次数", type: "number", default: "3" },
        { key: "task_log_retention", label: "日志保留天数", desc: "任务日志保留的天数，超期自动清理", type: "number", default: "30" }
      ]
    },
    {
      key: "notification",
      title: "通知设置",
      icon: "🔔",
      items: [
        { key: "notify_on_complete", label: "任务完成通知", desc: "任务完成时发送通知", type: "switch", default: "true" },
        { key: "notify_on_failure", label: "任务失败通知", desc: "任务失败时发送通知", type: "switch", default: "true" },
        { key: "notify_email", label: "通知邮箱", desc: "接收通知的邮箱地址", type: "text", default: "" },
        { key: "notify_interval", label: "通知频率", desc: "同一任务重复通知的最小间隔(分钟)", type: "number", default: "60" }
      ]
    },
    {
      key: "security",
      title: "安全设置",
      icon: "🔒",
      items: [
        { key: "session_timeout", label: "会话超时 (分钟)", desc: "登录会话过期时间", type: "number", default: "480" },
        { key: "max_login_attempts", label: "最大登录尝试", desc: "连续登录失败次数限制", type: "number", default: "5" },
        { key: "login_lockout_minutes", label: "锁定时间 (分钟)", desc: "超过登录尝试次数后的锁定时间", type: "number", default: "30" },
        { key: "enable_captcha", label: "验证码登录", desc: "登录时启用验证码验证", type: "switch", default: "false" }
      ]
    },
    {
      key: "network",
      title: "网络设置",
      icon: "🌐",
      items: [
        { key: "proxy_enabled", label: "代理服务器", desc: "是否使用代理服务器访问外部网络", type: "switch", default: "false" },
        { key: "proxy_host", label: "代理地址", desc: "代理服务器主机地址", type: "text", default: "" },
        { key: "proxy_port", label: "代理端口", desc: "代理服务器端口号", type: "number", default: "8080" },
        { key: "download_timeout", label: "下载超时 (秒)", desc: "远程文件下载超时时间", type: "number", default: "300" }
      ]
    }
  ];

  function getLocalSettings() {
    try {
      var data = localStorage.getItem(LOCAL_KEY);
      return data ? JSON.parse(data) : {};
    } catch(e) {
      return {};
    }
  }

  function saveLocalSettings(settings) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(settings));
  }

  function getDefaultSettings() {
    var defaults = {};
    for (var g = 0; g < settingGroups.length; g++) {
      var group = settingGroups[g];
      for (var i = 0; i < group.items.length; i++) {
        var item = group.items[i];
        defaults[item.key] = item.default;
      }
    }
    return defaults;
  }

  function loadSettings() {
    var container = document.getElementById("settingsContainer");
    var loading = document.getElementById("loadingState");

    api("/settings").then(function(res) {
      loading.style.display = "none";
      if (res.code === 0) {
        currentSettings = res.data || {};
        fillDefaults();
        renderSettings();
      } else {
        loadFromLocal();
      }
    }).catch(function(err) {
      loading.style.display = "none";
      loadFromLocal();
    });
  }

  function loadFromLocal() {
    var local = getLocalSettings();
    if (Object.keys(local).length === 0) {
      local = getDefaultSettings();
      saveLocalSettings(local);
    }
    currentSettings = local;
    fillDefaults();
    renderSettings();
  }

  function fillDefaults() {
    for (var g = 0; g < settingGroups.length; g++) {
      var group = settingGroups[g];
      for (var i = 0; i < group.items.length; i++) {
        var item = group.items[i];
        if (currentSettings[item.key] === undefined || currentSettings[item.key] === null) {
          currentSettings[item.key] = item.default;
        }
      }
    }
  }

  function renderSettings() {
    var container = document.getElementById("settingsContainer");
    var html = "";
    for (var g = 0; g < settingGroups.length; g++) {
      var group = settingGroups[g];
      html += "<div class=\"settings-section\">";
      html += "<div class=\"section-header\"><span>" + group.icon + "</span><span>" + esc(group.title) + "</span></div>";
      html += "<div class=\"section-body\">";
      for (var i = 0; i < group.items.length; i++) {
        var item = group.items[i];
        var value = currentSettings[item.key] !== undefined ? currentSettings[item.key] : item.default;
        html += "<div class=\"setting-item\">";
        html += "<div class=\"setting-info\"><div class=\"setting-label\">" + esc(item.label) + "</div><div class=\"setting-desc\">" + esc(item.desc) + "</div></div>";
        html += "<div class=\"setting-control\">";
        if (item.type === "switch") {
          var checked = value === "true" || value === true ? " checked" : "";
          html += "<label class=\"toggle-switch\"><input type=\"checkbox\" data-key=\"" + esc(item.key) + "\"" + checked + " onchange=\"toggleSetting(this)\"><span class=\"slider\"></span></label>";
          html += "<span class=\"setting-value-text\" id=\"val_" + esc(item.key) + "\">" + (checked ? "开启" : "关闭") + "</span>";
        } else if (item.type === "select") {
          html += "<select data-key=\"" + esc(item.key) + "\" id=\"sel_" + esc(item.key) + "\">";
          for (var oi = 0; oi < item.options.length; oi++) {
            var opt = item.options[oi];
            html += "<option value=\"" + esc(opt.value) + "\"" + (String(value) === String(opt.value) ? " selected" : "") + ">" + esc(opt.label) + "</option>";
          }
          html += "</select>";
          html += "<button class=\"btn-save-setting\" onclick=\"saveSetting(\'" + esc(item.key) + "\')\" style=\"margin-left:8px;\">保存</button>";
        } else {
          html += "<input type=\"" + item.type + "\" id=\"inp_" + esc(item.key) + "\" value=\"" + esc(value) + "\" data-key=\"" + esc(item.key) + "\">";
          html += "<button class=\"btn-save-setting\" onclick=\"saveSetting(\'" + esc(item.key) + "\')\" style=\"margin-left:8px;\">保存</button>";
        }
        html += "</div>";
        html += "</div>";
      }
      html += "</div></div>";
    }
    container.innerHTML = html;
  }

  window.toggleSetting = function(el) {
    var key = el.getAttribute("data-key");
    var checked = el.checked;
    var valEl = document.getElementById("val_" + key);
    if (valEl) valEl.textContent = checked ? "开启" : "关闭";

    currentSettings[key] = checked ? "true" : "false";
    saveToServer(key, checked ? "true" : "false");
  };

  window.saveSetting = function(key) {
    var value;
    var inp = document.getElementById("inp_" + key);
    var sel = document.getElementById("sel_" + key);
    if (inp) {
      value = inp.value.trim();
    } else if (sel) {
      value = sel.value;
    } else {
      return;
    }

    currentSettings[key] = value;
    saveToServer(key, value);
  };

  function saveToServer(key, value) {
    var body = {};
    body[key] = value;

    api("/settings", { method: "PUT", body: body }).then(function(res) {
      if (res.code === 0) {
        toast("设置项 \"" + key + "\" 已保存", "success");
        saveLocalSettings(currentSettings);
      } else {
        // Fallback: save locally
        saveLocalSettings(currentSettings);
        toast("设置已保存到本地", "success");
      }
    }).catch(function(err) {
      // Fallback: save locally
      saveLocalSettings(currentSettings);
      toast("设置已保存到本地（服务器不可用）", "success");
    });
  }

  loadSettings();

})();
</script>
</body>
</html>
