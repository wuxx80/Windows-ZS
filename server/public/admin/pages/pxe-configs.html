<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PXE配置 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:24px;background:transparent;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}
h2{margin-bottom:16px;font-size:20px;font-weight:600;color:#334155;}
.search-bar{margin-bottom:16px;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.data-table .config-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-item{padding:10px 14px;background:#f8fafc;border-radius:6px;}
.detail-item .dt-label{font-size:12px;color:#64748b;margin-bottom:2px;}
.detail-item .dt-value{font-size:14px;color:#1e293b;font-weight:500;word-break:break-all;}
.detail-full{grid-column:1 / -1;}
</style>
</head>
<body>

<h2>PXE配置</h2>

<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="关键词搜索（名称/服务器IP）" style="min-width:200px;">
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="enabled">启用</option>
    <option value="disabled">禁用</option>
  </select>
  <button class="btn-search" onclick="searchConfig()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">新增PXE配置</button>
</div>

<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:60px;">ID</th>
          <th>名称</th>
          <th style="width:130px;">服务器IP</th>
          <th style="width:130px;">子网</th>
          <th style="width:160px;">DHCP范围</th>
          <th>启动镜像</th>
          <th style="width:70px;">状态</th>
          <th style="width:60px;">激活</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:210px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">🌐</div>
      <p>暂无PXE配置数据</p>
    </div>
  </div>
</div>

<div id="paginationContainer"></div>

<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalItems = 0;
  var currentList = [];

  function loadList() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var status = document.getElementById('searchStatus').value;

    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (status) params += '&status=' + encodeURIComponent(status);

    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';

    api('/pxeConfigs?' + params).then(function(res) {
      if (res.code === 0) {
        totalItems = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');

    if (!list || list.length === 0) {
      tableBody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var isActive = item.is_active === 1 || item.is_active === '1' || item.is_active === true;
      html += '<tr>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><strong>' + esc(item.name) + '</strong></td>';
      html += '<td>' + esc(item.server_ip || '-') + '</td>';
      html += '<td>' + esc(item.subnet || '-') + '</td>';
      html += '<td>' + esc(item.dhcp_range || '-') + '</td>';
      html += '<td><div class="config-cell" title="' + esc(item.boot_image) + '">' + esc(item.boot_image || '-') + '</div></td>';
      html += '<td>' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</td>';
      html += '<td>' + (isActive ? '<span class="status-badge running">是</span>' : '<span class="status-badge pending">否</span>') + '</td>';
      html += '<td>' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      html += '<button class="action-btn edit" onclick="showEditModal(' + item.id + ')">编辑</button>';
      html += '<button class="action-btn delete" onclick="deleteItem(' + item.id + ')">删除</button>';
      if (!isActive) {
        html += '<button class="action-btn run" onclick="activateItem(' + item.id + ')">激活</button>';
      }
      html += '<button class="action-btn more" onclick="viewDetail(' + item.id + ')">详情</button>';
      html += '</td>';
      html += '</tr>';
    }
    tableBody.innerHTML = html;
  }

  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalItems / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalItems + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) {
      html += '<button class="page-btn" onclick="goToPage(1)">首页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    }
    if (currentPage < totalPages) {
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>';
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadList();
  };

  window.searchConfig = function() {
    currentPage = 1;
    loadList();
  };

  window.resetSearch = function() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchStatus').value = '';
    currentPage = 1;
    loadList();
  };

  function getFormData() {
    return {
      name: document.getElementById('formName').value.trim(),
      server_ip: document.getElementById('formServerIp').value.trim(),
      subnet: document.getElementById('formSubnet').value.trim(),
      dhcp_range: document.getElementById('formDhcpRange').value.trim(),
      boot_image: document.getElementById('formBootImage').value.trim(),
      menu_config: document.getElementById('formMenuConfig').value.trim(),
      status: document.getElementById('formStatus').value
    };
  }

  function buildFormContent(data) {
    var name = data ? esc(data.name) : '';
    var serverIp = data ? esc(data.server_ip) : '';
    var subnet = data ? esc(data.subnet) : '';
    var dhcpRange = data ? esc(data.dhcp_range) : '';
    var bootImage = data ? esc(data.boot_image) : '';
    var menuConfig = data ? esc(data.menu_config) : '';
    var status = data ? (data.status || 'enabled') : 'enabled';

    var content = '';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" value="' + name + '" placeholder="配置名称"></div>';
    content += '<div class="form-group"><label>服务器IP</label><input type="text" id="formServerIp" value="' + serverIp + '" placeholder="如: 192.168.1.100"></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>子网</label><input type="text" id="formSubnet" value="' + subnet + '" placeholder="如: 255.255.255.0"></div>';
    content += '<div class="form-group"><label>DHCP范围</label><input type="text" id="formDhcpRange" value="' + dhcpRange + '" placeholder="如: 192.168.1.100-200"></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>启动镜像</label><input type="text" id="formBootImage" value="' + bootImage + '" placeholder="如: boot.wim"></div>';
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="enabled"' + (status === 'enabled' ? ' selected' : '') + '>启用</option><option value="disabled"' + (status === 'disabled' ? ' selected' : '') + '>禁用</option></select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>菜单配置</label><textarea id="formMenuConfig" rows="4" placeholder="PXE启动菜单配置内容（可选）">' + menuConfig + '</textarea></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveItem()">保存</button>';
    content += '</div>';
    return content;
  }

  window.showAddModal = function() {
    var content = buildFormContent(null);
    var modal = showModal('新增PXE配置', content);
    modal.setAttribute('data-mode', 'add');
    modal.setAttribute('data-id', '');
  };

  window.showEditModal = function(id) {
    api('/pxeConfigs/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var content = buildFormContent(item);
      var modal = showModal('编辑PXE配置', content);
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) {
      toast('获取详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.saveItem = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';

    var data = getFormData();
    if (!data.name) {
      toast('请输入配置名称', 'error');
      return;
    }

    var request;
    if (mode === 'edit' && id) {
      request = api('/pxeConfigs/' + id, { method: 'PUT', body: data });
    } else {
      request = api('/pxeConfigs', { method: 'POST', body: data });
    }

    request.then(function(res) {
      if (res.code === 0) {
        toast(mode === 'edit' ? '更新成功' : '创建成功', 'success');
        closeModal();
        loadList();
      } else {
        toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.deleteItem = function(id) {
    if (!confirm('确定要删除该PXE配置吗？此操作不可恢复。')) return;
    api('/pxeConfigs/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) {
        toast('删除成功', 'success');
        loadList();
      } else {
        toast(res.message || '删除失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.activateItem = function(id) {
    if (!confirm('确定要激活该PXE配置吗？将自动禁用其他激活的配置。')) return;
    api('/pxeConfigs/' + id + '/activate', { method: 'POST' }).then(function(res) {
      if (res.code === 0) {
        toast('激活成功', 'success');
        loadList();
      } else {
        toast(res.message || '激活失败', 'error');
      }
    }).catch(function(err) {
      toast('激活请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.viewDetail = function(id) {
    toast('正在加载详情...', 'info');
    api('/pxeConfigs/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var isActive = item.is_active === 1 || item.is_active === '1' || item.is_active === true;
      var content = '';
      content += '<div class="detail-grid">';
      content += '<div class="detail-item"><div class="dt-label">ID</div><div class="dt-value">' + esc(item.id) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">名称</div><div class="dt-value">' + esc(item.name) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">服务器IP</div><div class="dt-value">' + esc(item.server_ip || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">子网</div><div class="dt-value">' + esc(item.subnet || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">DHCP范围</div><div class="dt-value">' + esc(item.dhcp_range || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">启动镜像</div><div class="dt-value">' + esc(item.boot_image || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">是否激活</div><div class="dt-value">' + (isActive ? '<span class="status-badge running">是</span>' : '<span class="status-badge pending">否</span>') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(item.created_at) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">更新时间</div><div class="dt-value">' + fmtDate(item.updated_at) + '</div></div>';
      if (item.menu_config) {
        content += '<div class="detail-item detail-full"><div class="dt-label">菜单配置</div><div class="dt-value" style="font-size:12px;font-family:monospace;white-space:pre-wrap;">' + esc(item.menu_config) + '</div></div>';
      }
      content += '</div>';
      content += '<div class="form-actions" style="margin-top:16px;">';
      content += '<button class="btn-cancel" onclick="closeModal()">关闭</button>';
      content += '<button class="action-btn edit" style="padding:8px 20px;font-size:13px;" onclick="closeModal();showEditModal(' + item.id + ')">编辑</button>';
      if (!isActive) {
        content += '<button class="action-btn run" style="padding:8px 20px;font-size:13px;" onclick="closeModal();activateItem(' + item.id + ')">激活</button>';
      }
      content += '</div>';

      showModal('PXE配置详情 - ' + esc(item.name), content);
    }).catch(function(err) {
      toast('获取详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  loadList();

})();
</script>
</body>
</html>
