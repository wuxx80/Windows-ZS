<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户端管理 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body { padding: 24px; background: transparent; }
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-header h2 { font-size: 20px; font-weight: 600; margin: 0; }
.search-bar .search-keyword { min-width: 180px; }
.search-bar .search-status { min-width: 130px; }
.search-bar .search-os { min-width: 120px; }
.search-bar .btn-batch-approve {
  padding: 8px 16px; background: #16a34a; color: var(--white);
  border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
  transition: background 0.2s; display: none;
}
.search-bar .btn-batch-approve:hover { background: #15803d; }
.search-bar .btn-batch-approve.show { display: inline-block; }
.actions-cell { display: flex; gap: 4px; flex-wrap: wrap; }
.client-id-cell { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: var(--text-light); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hostname-link { color: var(--primary); text-decoration: none; font-weight: 500; }
.hostname-link:hover { text-decoration: underline; }
.mac-cell { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; color: var(--text-light); }
.ip-cell { font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
.last-online-cell { font-size: 12px; color: var(--text-light); }
.modal-body-section { margin-bottom: 16px; }
.modal-body-section h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.detail-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.detail-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.checkbox-cell { width: 36px; text-align: center; }
.checkbox-cell input { cursor: pointer; width: 16px; height: 16px; }
.send-command-area { margin-top: 12px; }
.send-command-area textarea { width: 100%; min-height: 80px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: 'Consolas', 'Monaco', monospace; outline: none; resize: vertical; }
.send-command-area textarea:focus { border-color: var(--primary); }
.send-command-area .cmd-hint { font-size: 12px; color: var(--text-light); margin-top: 4px; }
.selected-count { font-size: 13px; color: var(--text-light); margin-left: 8px; }
</style>
</head>
<body>
<div class="page-header">
  <h2>客户端管理</h2>
</div>

<!-- Search Bar -->
<div class="search-bar" id="searchBar">
  <input type="text" class="search-keyword" id="searchKeyword" placeholder="搜索主机名/IP/标识..." style="min-width:180px;">
  <select class="search-status" id="searchStatus">
    <option value="">全部状态</option>
    <option value="pending">待审批</option>
    <option value="approved">已批准</option>
    <option value="blocked">已封禁</option>
    <option value="offline">离线</option>
  </select>
  <select class="search-os" id="searchOs">
    <option value="">全部系统</option>
    <option value="windows">Windows</option>
    <option value="linux">Linux</option>
    <option value="macos">macOS</option>
    <option value="other">其他</option>
  </select>
  <button class="btn-search" onclick="searchClients()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <span class="selected-count" id="selectedCount"></span>
  <button class="btn-batch-approve" id="btnBatchApprove" onclick="batchApprove()">批量审批</button>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="clientTable">
      <thead>
        <tr>
          <th class="checkbox-cell"><input type="checkbox" id="checkAll" onclick="toggleAllCheckbox()"></th>
          <th style="width:50px;">ID</th>
          <th style="width:130px;">客户端标识</th>
          <th>主机名</th>
          <th style="width:130px;">IP地址</th>
          <th style="width:140px;">MAC地址</th>
          <th style="width:100px;">操作系统</th>
          <th style="width:80px;">状态</th>
          <th style="width:140px;">最后在线</th>
          <th style="width:280px;">操作</th>
        </tr>
      </thead>
      <tbody id="clientBody">
        <tr><td colspan="10"><div class="empty-state"><div class="empty-icon">🖥️</div><p>加载中...</p></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Pagination -->
<div id="pagination"></div>

<!-- ========== Detail Modal ========== -->
<div id="detailModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:720px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>客户端详情</span>
      <button onclick="closeDetailModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;" id="detailModalBody">
      <!-- Dynamic content -->
    </div>
  </div>
</div>

<!-- ========== Edit Modal ========== -->
<div id="editModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>编辑客户端</span>
      <button onclick="closeEditModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;">
      <div class="form-group">
        <label>主机名 <span style="color:#dc2626;">*</span></label>
        <input type="text" id="editHostname" placeholder="请输入主机名">
      </div>
      <div class="form-group">
        <label>分组ID</label>
        <input type="text" id="editGroupId" placeholder="客户端分组ID">
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="editRemark" placeholder="备注信息" style="min-height:60px;"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeEditModal()">取消</button>
        <button class="btn-submit" onclick="submitEdit()">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== Send Command Modal ========== -->
<div id="commandModalOverlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;width:90%;max-width:520px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
    <div style="padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;">
      <span>发送命令</span>
      <button onclick="closeCommandModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;">&times;</button>
    </div>
    <div style="padding:20px 24px;">
      <div class="form-group">
        <label>目标客户端 <span style="color:#dc2626;">*</span></label>
        <div id="commandTargets" style="font-size:13px;color:var(--text);padding:8px 12px;background:#f8f9fa;border-radius:6px;max-height:80px;overflow-y:auto;"></div>
      </div>
      <div class="form-group">
        <label>命令类型 <span style="color:#dc2626;">*</span></label>
        <select id="commandType">
          <option value="exec">执行命令</option>
          <option value="script">运行脚本</option>
          <option value="restart">重启客户端</option>
          <option value="update">更新客户端</option>
          <option value="custom">自定义</option>
        </select>
      </div>
      <div class="form-group">
        <label>命令内容 <span style="color:#dc2626;">*</span></label>
        <textarea id="commandContent" placeholder="输入要执行的命令或脚本内容..." style="min-height:100px;font-family:'Consolas','Monaco',monospace;"></textarea>
      </div>
      <div class="form-group">
        <label>参数（JSON格式，可选）</label>
        <textarea id="commandParams" placeholder='{"timeout": 30}' style="min-height:50px;font-family:'Consolas','Monaco',monospace;"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeCommandModal()">取消</button>
        <button class="btn-submit" onclick="submitCommand()">发送</button>
      </div>
    </div>
  </div>
</div>

<script src="../../assets/js/admin-common.js"></script>
<script>
// ========== State ==========
var currentPage = 1;
var pageSize = 15;
var totalCount = 0;
var selectedIds = [];

// ========== OS Label Map ==========
var osLabelMap = {
  'windows': 'Windows',
  'linux': 'Linux',
  'macos': 'macOS',
  'other': '其他'
};

// ========== Load Clients ==========
function loadClients() {
  var keyword = document.getElementById('searchKeyword').value;
  var status = document.getElementById('searchStatus').value;
  var os = document.getElementById('searchOs').value;
  var params = [];
  params.push('page=' + currentPage);
  params.push('pageSize=' + pageSize);
  if (keyword) params.push('keyword=' + encodeURIComponent(keyword));
  if (status) params.push('status=' + encodeURIComponent(status));
  if (os) params.push('os=' + encodeURIComponent(os));
  var tbody = document.getElementById('clientBody');
  tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">⏳</div><p>加载中...</p></div></td></tr>';
  api('/clients?' + params.join('&')).then(function(res) {
    if (res.code === 0) {
      renderClients(res.data);
    } else {
      tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">❌</div><p>' + esc(res.message || '加载失败') + '</p></div></td></tr>';
    }
  }).catch(function(err) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">❌</div><p>网络错误：' + esc(err.message) + '</p></div></td></tr>';
  });
}

function renderClients(data) {
  var list = data.list || [];
  totalCount = data.total || 0;
  var tbody = document.getElementById('clientBody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">🖥️</div><p>暂无客户端数据</p></div></td></tr>';
    document.getElementById('pagination').innerHTML = '';
    updateSelectedCount();
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var statusHtml = buildStatusBadge(item.status);
    var osLabel = osLabelMap[item.os] || item.os || '-';
    var osVersion = item.os_version ? ' ' + esc(item.os_version) : '';
    var actionsHtml = buildActions(item);
    var checked = selectedIds.indexOf(item.id) !== -1 ? 'checked' : '';
    html += '<tr>' +
      '<td class="checkbox-cell"><input type="checkbox" class="client-checkbox" data-id="' + item.id + '" ' + checked + ' onchange="onCheckboxChange()"></td>' +
      '<td>' + esc(item.id) + '</td>' +
      '<td><div class="client-id-cell" title="' + esc(item.client_id) + '">' + esc(item.client_id) + '</div></td>' +
      '<td><a href="javascript:void(0)" class="hostname-link" onclick="showDetail(' + item.id + ')">' + esc(item.hostname || '-') + '</a></td>' +
      '<td><span class="ip-cell">' + esc(item.last_ip || '-') + '</span></td>' +
      '<td><span class="mac-cell">' + esc(item.mac_address || '-') + '</span></td>' +
      '<td>' + esc(osLabel) + osVersion + '</td>' +
      '<td>' + statusHtml + '</td>' +
      '<td><span class="last-online-cell">' + fmtDate(item.last_heartbeat) + '</span></td>' +
      '<td><div class="actions-cell">' + actionsHtml + '</div></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
  var paginationHtml = renderPagination(totalCount, currentPage, pageSize, 'goToPage');
  document.getElementById('pagination').innerHTML = paginationHtml;
  var pageBtns = document.querySelectorAll('#pagination .page-btn');
  for (var j = 0; j < pageBtns.length; j++) {
    (function(btn) {
      btn.onclick = function() {
        var page = parseInt(this.getAttribute('data-page'));
        if (page && page !== currentPage) {
          currentPage = page;
          loadClients();
        }
      };
    })(pageBtns[j]);
  }
  updateSelectedCount();
}

function goToPage(page) {
  currentPage = page;
  loadClients();
}

function buildStatusBadge(status) {
  var labelMap = {
    'pending': '待审批',
    'approved': '已批准',
    'blocked': '已封禁',
    'offline': '离线'
  };
  var label = labelMap[status] || status;
  return statusBadge(status, label);
}

// ========== Actions ==========
function buildActions(item) {
  var actions = '';
  var id = item.id;
  actions += '<button class="action-btn edit" onclick="showEdit(' + id + ')">编辑</button>';
  if (item.status === 'pending') {
    actions += '<button class="action-btn run" onclick="approveClient(' + id + ')">审批</button>';
  }
  if (item.status !== 'blocked') {
    actions += '<button class="action-btn" style="background:#fff7ed;color:#ea580c;" onclick="blockClient(' + id + ')">封禁</button>';
  }
  actions += '<button class="action-btn delete" onclick="deleteClient(' + id + ')">删除</button>';
  actions += '<button class="action-btn more" onclick="showDetail(' + id + ')">详情</button>';
  actions += '<button class="action-btn run" onclick="showCommandModal(' + id + ')">命令</button>';
  return actions;
}

// ========== Search ==========
function searchClients() {
  currentPage = 1;
  selectedIds = [];
  document.getElementById('checkAll').checked = false;
  loadClients();
}

function resetSearch() {
  document.getElementById('searchKeyword').value = '';
  document.getElementById('searchStatus').value = '';
  document.getElementById('searchOs').value = '';
  currentPage = 1;
  selectedIds = [];
  document.getElementById('checkAll').checked = false;
  loadClients();
}

// ========== Checkbox ==========
function toggleAllCheckbox() {
  var checkAll = document.getElementById('checkAll').checked;
  var checkboxes = document.querySelectorAll('.client-checkbox');
  selectedIds = [];
  if (checkAll) {
    for (var i = 0; i < checkboxes.length; i++) {
      checkboxes[i].checked = true;
      var id = parseInt(checkboxes[i].getAttribute('data-id'));
      if (selectedIds.indexOf(id) === -1) {
        selectedIds.push(id);
      }
    }
  } else {
    for (var j = 0; j < checkboxes.length; j++) {
      checkboxes[j].checked = false;
    }
  }
  updateSelectedCount();
}

function onCheckboxChange() {
  var checkboxes = document.querySelectorAll('.client-checkbox');
  selectedIds = [];
  var allChecked = true;
  for (var i = 0; i < checkboxes.length; i++) {
    if (checkboxes[i].checked) {
      var id = parseInt(checkboxes[i].getAttribute('data-id'));
      if (selectedIds.indexOf(id) === -1) {
        selectedIds.push(id);
      }
    } else {
      allChecked = false;
    }
  }
  document.getElementById('checkAll').checked = allChecked && checkboxes.length > 0;
  updateSelectedCount();
}

function updateSelectedCount() {
  var count = selectedIds.length;
  var countEl = document.getElementById('selectedCount');
  var batchBtn = document.getElementById('btnBatchApprove');
  if (count > 0) {
    countEl.textContent = '已选择 ' + count + ' 项';
    batchBtn.classList.add('show');
  } else {
    countEl.textContent = '';
    batchBtn.classList.remove('show');
  }
}

// ========== Approve ==========
function approveClient(id) {
  if (!confirm('确定要审批该客户端吗？')) return;
  api('/clients/' + id + '/approve', { method: 'POST' }).then(function(res) {
    if (res.code === 0) {
      toast('客户端已审批通过', 'success');
      loadClients();
    } else {
      toast(res.message || '审批失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

function batchApprove() {
  if (selectedIds.length === 0) {
    toast('请先选择要审批的客户端', 'error');
    return;
  }
  if (!confirm('确定要批量审批选中的 ' + selectedIds.length + ' 个客户端吗？')) return;
  api('/clients/batchApprove', { method: 'POST', body: { ids: selectedIds } }).then(function(res) {
    if (res.code === 0) {
      toast('批量审批完成', 'success');
      selectedIds = [];
      document.getElementById('checkAll').checked = false;
      loadClients();
    } else {
      toast(res.message || '批量审批失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

// ========== Block ==========
function blockClient(id) {
  if (!confirm('确定要封禁该客户端吗？封禁后客户端将无法连接。')) return;
  api('/clients/' + id + '/block', { method: 'POST' }).then(function(res) {
    if (res.code === 0) {
      toast('客户端已封禁', 'success');
      loadClients();
    } else {
      toast(res.message || '封禁失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

// ========== Delete ==========
function deleteClient(id) {
  if (!confirm('确定要删除该客户端吗？此操作不可恢复！')) return;
  api('/clients/' + id, { method: 'DELETE' }).then(function(res) {
    if (res.code === 0) {
      toast('客户端已删除', 'success');
      loadClients();
    } else {
      toast(res.message || '删除失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

// ========== Edit ==========
var editClientId = null;

function showEdit(id) {
  editClientId = id;
  document.getElementById('editHostname').value = '';
  document.getElementById('editGroupId').value = '';
  document.getElementById('editRemark').value = '';
  // Load current data
  api('/clients/' + id).then(function(res) {
    if (res.code === 0) {
      var data = res.data;
      var client = data.client || data;
      document.getElementById('editHostname').value = client.hostname || '';
      document.getElementById('editGroupId').value = client.group_id || '';
      document.getElementById('editRemark').value = client.remark || '';
    }
  }).catch(function(err) {
    // Continue with empty form
  });
  document.getElementById('editModalOverlay').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('editModalOverlay').style.display = 'none';
  editClientId = null;
}

function submitEdit() {
  var hostname = document.getElementById('editHostname').value.trim();
  if (!hostname) {
    toast('请输入主机名', 'error');
    return;
  }
  var body = {
    hostname: hostname,
    group_id: document.getElementById('editGroupId').value.trim() || undefined,
    remark: document.getElementById('editRemark').value.trim() || undefined
  };
  if (!editClientId) {
    toast('编辑失败：缺少客户端ID', 'error');
    return;
  }
  api('/clients/' + editClientId, { method: 'PUT', body: body }).then(function(res) {
    if (res.code === 0) {
      toast('客户端信息已更新', 'success');
      closeEditModal();
      loadClients();
    } else {
      toast(res.message || '更新失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

// ========== Detail ==========
function showDetail(id) {
  var overlay = document.getElementById('detailModalOverlay');
  var body = document.getElementById('detailModalBody');
  body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-light);">加载中...</div>';
  overlay.style.display = 'flex';
  api('/clients/' + id).then(function(res) {
    if (res.code === 0) {
      renderDetail(res.data);
    } else {
      body.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">' + esc(res.message || '加载失败') + '</div>';
    }
  }).catch(function(err) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">网络错误：' + esc(err.message) + '</div>';
  });
}

function renderDetail(data) {
  var client = data.client || data;
  var group = data.group || null;
  var lastTask = data.lastTask || null;
  var html = '';

  // Basic info
  html += '<div class="modal-body-section"><h4>基本信息</h4><div class="detail-grid-2">';
  html += '<div class="detail-item"><div class="dt-label">ID</div><div class="dt-value">' + esc(client.id) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">客户端标识</div><div class="dt-value" style="font-size:12px;font-family:monospace;">' + esc(client.client_id) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">主机名</div><div class="dt-value">' + esc(client.hostname || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">IP地址</div><div class="dt-value">' + esc(client.last_ip || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">MAC地址</div><div class="dt-value" style="font-size:12px;font-family:monospace;">' + esc(client.mac_address || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">操作系统</div><div class="dt-value">' + esc((osLabelMap[client.os] || client.os || '-')) + (client.os_version ? ' ' + esc(client.os_version) : '') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + buildStatusBadge(client.status) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">分组ID</div><div class="dt-value">' + esc(client.group_id || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">备注</div><div class="dt-value">' + esc(client.remark || '-') + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">最后在线时间</div><div class="dt-value">' + fmtDate(client.last_heartbeat) + '</div></div>';
  html += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(client.created_at) + '</div></div>';
  html += '</div></div>';

  // Group info
  if (group) {
    html += '<div class="modal-body-section"><h4>所属分组</h4><div class="detail-grid-2">';
    html += '<div class="detail-item"><div class="dt-label">分组ID</div><div class="dt-value">' + esc(group.id) + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">分组名称</div><div class="dt-value">' + esc(group.name || '-') + '</div></div>';
    html += '</div></div>';
  }

  // Last task
  if (lastTask) {
    html += '<div class="modal-body-section"><h4>最近任务</h4><div class="detail-grid-2">';
    html += '<div class="detail-item"><div class="dt-label">任务ID</div><div class="dt-value">' + esc(lastTask.id) + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">任务名称</div><div class="dt-value">' + esc(lastTask.name || '-') + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">任务状态</div><div class="dt-value">' + statusBadge(lastTask.status, lastTask.status) + '</div></div>';
    html += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(lastTask.created_at) + '</div></div>';
    html += '</div></div>';
  }

  // Actions
  html += '<div class="form-actions" style="border-top:1px solid var(--border);">';
  if (client.status === 'pending') {
    html += '<button class="action-btn run" style="padding:6px 16px;font-size:13px;" onclick="approveFromDetail(' + client.id + ')">审批通过</button>';
  }
  if (client.status !== 'blocked') {
    html += '<button class="action-btn" style="padding:6px 16px;font-size:13px;background:#fff7ed;color:#ea580c;" onclick="blockFromDetail(' + client.id + ')">封禁</button>';
  }
  html += '<button class="action-btn edit" style="padding:6px 16px;font-size:13px;" onclick="editFromDetail(' + client.id + ')">编辑</button>';
  html += '<button class="action-btn run" style="padding:6px 16px;font-size:13px;" onclick="commandFromDetail(' + client.id + ')">发送命令</button>';
  html += '<button class="btn-cancel" onclick="closeDetailModal()" style="padding:6px 16px;font-size:13px;">关闭</button>';
  html += '</div>';

  document.getElementById('detailModalBody').innerHTML = html;
}

function closeDetailModal() {
  document.getElementById('detailModalOverlay').style.display = 'none';
}

function approveFromDetail(id) { closeDetailModal(); approveClient(id); }
function blockFromDetail(id) { closeDetailModal(); blockClient(id); }
function editFromDetail(id) { closeDetailModal(); showEdit(id); }
function commandFromDetail(id) { closeDetailModal(); showCommandModal(id); }

// ========== Send Command ==========
var commandClientIds = [];

function showCommandModal(clientId) {
  commandClientIds = clientId ? [clientId] : selectedIds.slice();
  if (commandClientIds.length === 0) {
    toast('请先选择一个客户端', 'error');
    return;
  }
  document.getElementById('commandType').value = 'exec';
  document.getElementById('commandContent').value = '';
  document.getElementById('commandParams').value = '';
  var targetsEl = document.getElementById('commandTargets');
  var count = commandClientIds.length;
  if (count === 1) {
    targetsEl.textContent = '客户端 ID: ' + commandClientIds[0];
  } else {
    targetsEl.textContent = '已选择 ' + count + ' 个客户端 (ID: ' + commandClientIds.join(', ') + ')';
  }
  document.getElementById('commandModalOverlay').style.display = 'flex';
}

function closeCommandModal() {
  document.getElementById('commandModalOverlay').style.display = 'none';
  commandClientIds = [];
}

function submitCommand() {
  var command = document.getElementById('commandType').value;
  var content = document.getElementById('commandContent').value.trim();
  if (!content) {
    toast('请输入命令内容', 'error');
    return;
  }
  var body = {
    client_ids: commandClientIds,
    command: command,
    params: { content: content }
  };
  var paramsStr = document.getElementById('commandParams').value.trim();
  if (paramsStr) {
    try {
      var extraParams = JSON.parse(paramsStr);
      for (var key in extraParams) {
        if (extraParams.hasOwnProperty(key)) {
          body.params[key] = extraParams[key];
        }
      }
    } catch (e) {
      toast('参数格式错误，请输入合法的JSON', 'error');
      return;
    }
  }
  if (!confirm('确定要向 ' + commandClientIds.length + ' 个客户端发送命令吗？')) return;
  api('/clients/sendCommand', { method: 'POST', body: body }).then(function(res) {
    if (res.code === 0) {
      toast('命令已发送成功', 'success');
      closeCommandModal();
    } else {
      toast(res.message || '发送命令失败', 'error');
    }
  }).catch(function(err) {
    toast('网络错误：' + err.message, 'error');
  });
}

// ========== Init ==========
loadClients();
</script>
</body>
</html>
