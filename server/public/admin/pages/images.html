<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>镜像列表 - ZS 装机助手</title>
<link rel="stylesheet" href="../../assets/css/admin.css">
<style>
body{padding:0;background:transparent;font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;}
h2{margin-bottom:16px;font-size:20px;font-weight:600;color:#334155;}
.search-bar{margin-bottom:16px;}
.batch-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;padding:10px 16px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;}
.batch-bar .label{font-size:13px;color:#64748b;margin-right:4px;}
.batch-bar .btn-batch{padding:5px 14px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:#334155;transition:all 0.2s;}
.batch-bar .btn-batch:hover{border-color:#1a73e8;color:#1a73e8;}
.batch-bar .btn-batch.danger:hover{border-color:#dc2626;color:#dc2626;}
.data-table th{background:#f8fafc;white-space:nowrap;}
.data-table td{vertical-align:middle;}
.data-table .name-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.data-table .filename-cell{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.upload-area{border:2px dashed #e2e8f0;border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:all 0.3s;margin-bottom:16px;}
.upload-area:hover{border-color:#1a73e8;background:#f0f7ff;}
.upload-area .icon{font-size:36px;margin-bottom:8px;}
.upload-area .text{font-size:14px;color:#64748b;}
.upload-area .hint{font-size:12px;color:#94a3b8;margin-top:4px;}
.upload-progress{margin:12px 0;display:none;}
.upload-progress .progress-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.upload-progress .progress-fill{height:100%;background:#1a73e8;border-radius:3px;width:0%;transition:width 0.3s;}
.upload-progress .progress-text{font-size:12px;color:#64748b;margin-top:4px;text-align:center;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.detail-item{padding:10px 14px;background:#f8fafc;border-radius:6px;}
.detail-item .dt-label{font-size:12px;color:#64748b;margin-bottom:2px;}
.detail-item .dt-value{font-size:14px;color:#1e293b;font-weight:500;word-break:break-all;}
.detail-full{grid-column:1 / -1;}
</style>
</head>
<body>

<h2>镜像列表</h2>

<div class="search-bar">
  <input type="text" id="searchKeyword" placeholder="关键词搜索（名称/描述/文件名）" style="min-width:200px;">
  <select id="searchFormat">
    <option value="">全部格式</option>
    <option value="wim">WIM</option>
    <option value="iso">ISO</option>
    <option value="gho">GHO</option>
    <option value="esd">ESD</option>
  </select>
  <select id="searchStatus">
    <option value="">全部状态</option>
    <option value="enabled">启用</option>
    <option value="disabled">禁用</option>
  </select>
  <button class="btn-search" onclick="searchImages()">搜索</button>
  <button class="btn-reset" onclick="resetSearch()">重置</button>
  <button class="btn-create" onclick="showAddModal()">新增镜像</button>
  <button class="btn-create" style="background:#7c3aed;" onclick="showUploadModal()">上传镜像</button>
  <button class="btn-create" style="background:#0891b2;" onclick="showRemoteUrlModal()">远程导入</button>
</div>

<div class="batch-bar" id="batchBar" style="display:none;">
  <span class="label">已选择 <strong id="selectedCount">0</strong> 项</span>
  <button class="btn-batch" onclick="batchDelete()">批量删除</button>
  <button class="btn-batch" onclick="batchEnable()">批量启用</button>
  <button class="btn-batch" onclick="batchDisable()">批量禁用</button>
</div>

<div class="panel">
  <div class="panel-body" style="padding:0;">
    <table class="data-table" id="dataTable">
      <thead>
        <tr>
          <th style="width:36px;"><input type="checkbox" id="checkAll" onchange="toggleAllCheckbox()"></th>
          <th style="width:60px;">ID</th>
          <th>名称</th>
          <th style="width:160px;">文件名</th>
          <th style="width:70px;">格式</th>
          <th style="width:90px;">大小</th>
          <th style="width:130px;">系统类型</th>
          <th style="width:70px;">状态</th>
          <th style="width:140px;">创建时间</th>
          <th style="width:210px;">操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="empty-icon">💿</div>
      <p>暂无镜像数据</p>
    </div>
  </div>
</div>

<div id="paginationContainer"></div>

<script src="../../assets/js/admin-common.js"></script>
<script>
(function() {
  var currentPage = 1;
  var pageSize = 15;
  var totalImages = 0;
  var currentList = [];
  var selectedIds = [];

  function loadImages() {
    var keyword = document.getElementById('searchKeyword').value.trim();
    var format = document.getElementById('searchFormat').value;
    var status = document.getElementById('searchStatus').value;

    var params = 'page=' + currentPage + '&pageSize=' + pageSize;
    if (keyword) params += '&keyword=' + encodeURIComponent(keyword);
    if (format) params += '&format=' + encodeURIComponent(format);
    if (status) params += '&status=' + encodeURIComponent(status);

    var tableBody = document.getElementById('tableBody');
    tableBody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#94a3b8;">加载中...</td></tr>';

    api('/images?' + params).then(function(res) {
      if (res.code === 0) {
        totalImages = res.data.total || 0;
        currentList = res.data.list || [];
        renderTable(currentList);
        renderPagination();
      } else {
        toast(res.message || '加载失败', 'error');
        tableBody.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
      tableBody.innerHTML = '';
      document.getElementById('emptyState').style.display = 'block';
    });
  }

  function renderTable(list) {
    var tableBody = document.getElementById('tableBody');
    var emptyState = document.getElementById('emptyState');

    if (!list || list.length === 0) {
      tableBody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    var html = '';
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var checked = selectedIds.indexOf(item.id) !== -1 ? 'checked' : '';
      var osType = '';
      if (item.os_type) {
        osType = esc(item.os_type);
        if (item.os_version) osType += ' ' + esc(item.os_version);
        if (item.os_arch) osType += ' ' + esc(item.os_arch);
      } else {
        osType = '-';
      }
      html += '<tr>';
      html += '<td><input type="checkbox" class="row-checkbox" data-id="' + item.id + '" ' + checked + ' onchange="toggleRowCheckbox(this)"></td>';
      html += '<td>' + esc(item.id) + '</td>';
      html += '<td><div class="name-cell" title="' + esc(item.description || item.name) + '">' + esc(item.name) + '</div></td>';
      html += '<td><div class="filename-cell" title="' + esc(item.filename) + '">' + esc(item.filename) + '</div></td>';
      html += '<td>' + esc(item.format) + '</td>';
      html += '<td>' + fmtSize(item.file_size) + '</td>';
      html += '<td>' + osType + '</td>';
      html += '<td>' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</td>';
      html += '<td>' + fmtDate(item.created_at) + '</td>';
      html += '<td>';
      html += '<button class="action-btn edit" onclick="showEditModal(\'' + item.id + '\')">编辑</button>';
      html += '<button class="action-btn delete" onclick="deleteImage(\'' + item.id + '\')">删除</button>';
      html += '<button class="action-btn run" onclick="verifyImage(\'' + item.id + '\')">验证</button>';
      html += '<button class="action-btn more" onclick="viewDetail(\'' + item.id + '\')">详情</button>';
      html += '</td>';
      html += '</tr>';
    }
    tableBody.innerHTML = html;
    updateBatchBar();
  }

  function renderPagination() {
    var container = document.getElementById('paginationContainer');
    var totalPages = Math.ceil(totalImages / pageSize);
    if (totalPages <= 1) {
      container.innerHTML = '';
      return;
    }
    var html = '<div class="pagination">';
    html += '<span class="page-info">共 ' + totalImages + ' 条，第 ' + currentPage + '/' + totalPages + ' 页</span>';
    html += '<div class="page-btns">';
    if (currentPage > 1) {
      html += '<button class="page-btn" onclick="goToPage(1)">首页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage - 1) + ')">上一页</button>';
    }
    var startPage = Math.max(1, currentPage - 2);
    var endPage = Math.min(totalPages, currentPage + 2);
    for (var i = startPage; i <= endPage; i++) {
      html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" onclick="goToPage(' + i + ')">' + i + '</button>';
    }
    if (currentPage < totalPages) {
      html += '<button class="page-btn" onclick="goToPage(' + (currentPage + 1) + ')">下一页</button>';
      html += '<button class="page-btn" onclick="goToPage(' + totalPages + ')">末页</button>';
    }
    html += '</div></div>';
    container.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    loadImages();
  };

  window.searchImages = function() {
    currentPage = 1;
    selectedIds = [];
    loadImages();
  };

  window.resetSearch = function() {
    document.getElementById('searchKeyword').value = '';
    document.getElementById('searchFormat').value = '';
    document.getElementById('searchStatus').value = '';
    currentPage = 1;
    selectedIds = [];
    loadImages();
  };

  window.toggleAllCheckbox = function() {
    var checkAll = document.getElementById('checkAll');
    var checkboxes = document.querySelectorAll('.row-checkbox');
    selectedIds = [];
    if (checkAll.checked) {
      for (var i = 0; i < currentList.length; i++) {
        selectedIds.push(currentList[i].id);
      }
    }
    for (var j = 0; j < checkboxes.length; j++) {
      checkboxes[j].checked = checkAll.checked;
    }
    updateBatchBar();
  };

  window.toggleRowCheckbox = function(el) {
    var id = el.getAttribute('data-id');
    if (el.checked) {
      if (selectedIds.indexOf(id) === -1) selectedIds.push(id);
    } else {
      var idx = selectedIds.indexOf(id);
      if (idx !== -1) selectedIds.splice(idx, 1);
    }
    var allChecked = true;
    var checkboxes = document.querySelectorAll('.row-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
      if (!checkboxes[i].checked) { allChecked = false; break; }
    }
    document.getElementById('checkAll').checked = allChecked;
    updateBatchBar();
  };

  function updateBatchBar() {
    var bar = document.getElementById('batchBar');
    var count = document.getElementById('selectedCount');
    count.textContent = selectedIds.length;
    bar.style.display = selectedIds.length > 0 ? 'flex' : 'none';
  }

  window.showAddModal = function() {
    var content = '';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" placeholder="镜像名称"></div>';
    content += '<div class="form-group"><label>格式 <span style="color:#dc2626;">*</span></label><select id="formFormat"><option value="wim">WIM</option><option value="iso">ISO</option><option value="gho">GHO</option><option value="esd">ESD</option></select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>描述</label><textarea id="formDescription" placeholder="镜像描述" rows="2"></textarea></div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>文件名</label><input type="text" id="formFilename" placeholder="如: Win11_Pro.wim"></div>';
    content += '<div class="form-group"><label>文件大小 (字节)</label><input type="number" id="formFileSize" placeholder="0" min="0"></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>SHA256</label><input type="text" id="formSha256" placeholder="64位校验值"></div>';
    content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="enabled">启用</option><option value="disabled">禁用</option></select></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>系统类型</label><input type="text" id="formOsType" placeholder="如: Windows"></div>';
    content += '<div class="form-group"><label>系统版本</label><input type="text" id="formOsVersion" placeholder="如: 11 Pro"></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>系统架构</label><select id="formOsArch"><option value="">请选择</option><option value="x64">x64</option><option value="x86">x86</option><option value="arm64">arm64</option></select></div>';
    content += '<div class="form-group"><label>镜像源ID</label><input type="number" id="formSourceId" placeholder="可选" min="0"></div>';
    content += '</div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="saveImage()">保存</button>';
    content += '</div>';

    var modal = showModal('新增镜像', content);
    modal.setAttribute('data-mode', 'add');
    modal.setAttribute('data-id', '');
  };

  window.showEditModal = function(id) {
    api('/images/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var content = '';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>名称 <span style="color:#dc2626;">*</span></label><input type="text" id="formName" value="' + esc(item.name) + '"></div>';
      content += '<div class="form-group"><label>格式 <span style="color:#dc2626;">*</span></label><select id="formFormat">';
      var formats = ['wim', 'iso', 'gho', 'esd'];
      for (var fi = 0; fi < formats.length; fi++) {
        content += '<option value="' + formats[fi] + '"' + (item.format === formats[fi] ? ' selected' : '') + '>' + formats[fi].toUpperCase() + '</option>';
      }
      content += '</select></div>';
      content += '</div>';
      content += '<div class="form-group"><label>描述</label><textarea id="formDescription" rows="2">' + esc(item.description || '') + '</textarea></div>';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>文件名</label><input type="text" id="formFilename" value="' + esc(item.filename || '') + '"></div>';
      content += '<div class="form-group"><label>文件大小 (字节)</label><input type="number" id="formFileSize" value="' + (item.file_size || 0) + '" min="0"></div>';
      content += '</div>';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>SHA256</label><input type="text" id="formSha256" value="' + esc(item.sha256 || '') + '"></div>';
      content += '<div class="form-group"><label>状态</label><select id="formStatus"><option value="enabled"' + (item.status === 'enabled' ? ' selected' : '') + '>启用</option><option value="disabled"' + (item.status === 'disabled' ? ' selected' : '') + '>禁用</option></select></div>';
      content += '</div>';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>系统类型</label><input type="text" id="formOsType" value="' + esc(item.os_type || '') + '"></div>';
      content += '<div class="form-group"><label>系统版本</label><input type="text" id="formOsVersion" value="' + esc(item.os_version || '') + '"></div>';
      content += '</div>';
      content += '<div class="form-row">';
      content += '<div class="form-group"><label>系统架构</label><select id="formOsArch"><option value="">请选择</option><option value="x64"' + (item.os_arch === 'x64' ? ' selected' : '') + '>x64</option><option value="x86"' + (item.os_arch === 'x86' ? ' selected' : '') + '>x86</option><option value="arm64"' + (item.os_arch === 'arm64' ? ' selected' : '') + '>arm64</option></select></div>';
      content += '<div class="form-group"><label>镜像源ID</label><input type="number" id="formSourceId" value="' + (item.source_id || '') + '" min="0"></div>';
      content += '</div>';
      content += '<div class="form-actions">';
      content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
      content += '<button class="btn-submit" onclick="saveImage()">保存</button>';
      content += '</div>';

      var modal = showModal('编辑镜像', content);
      modal.setAttribute('data-mode', 'edit');
      modal.setAttribute('data-id', id);
    }).catch(function(err) {
      toast('获取镜像详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.saveImage = function() {
    var modal = document.getElementById('modalOverlay');
    var mode = modal ? modal.getAttribute('data-mode') : 'add';
    var id = modal ? modal.getAttribute('data-id') : '';

    var name = document.getElementById('formName').value.trim();
    var format = document.getElementById('formFormat').value;
    var description = document.getElementById('formDescription').value.trim();
    var filename = document.getElementById('formFilename').value.trim();
    var fileSize = document.getElementById('formFileSize').value;
    var sha256 = document.getElementById('formSha256').value.trim();
    var status = document.getElementById('formStatus').value;
    var osType = document.getElementById('formOsType').value.trim();
    var osVersion = document.getElementById('formOsVersion').value.trim();
    var osArch = document.getElementById('formOsArch').value;
    var sourceId = document.getElementById('formSourceId').value;

    if (!name) {
      toast('请输入镜像名称', 'error');
      return;
    }

    var body = {
      name: name,
      description: description,
      filename: filename,
      format: format,
      file_size: fileSize ? parseInt(fileSize, 10) : 0,
      sha256: sha256,
      os_type: osType,
      os_version: osVersion,
      os_arch: osArch,
      source_id: sourceId ? parseInt(sourceId, 10) : null,
      status: status
    };

    var request;
    if (mode === 'edit' && id) {
      request = api('/images/' + id, { method: 'PUT', body: body });
    } else {
      request = api('/images', { method: 'POST', body: body });
    }

    request.then(function(res) {
      if (res.code === 0) {
        toast(mode === 'edit' ? '更新成功' : '创建成功', 'success');
        closeModal();
        loadImages();
      } else {
        toast(res.message || (mode === 'edit' ? '更新失败' : '创建失败'), 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.deleteImage = function(id) {
    if (!confirm('确定要删除该镜像吗？此操作不可恢复。')) return;
    api('/images/' + id, { method: 'DELETE' }).then(function(res) {
      if (res.code === 0) {
        toast('删除成功', 'success');
        selectedIds = selectedIds.filter(function(sid) { return sid !== id; });
        loadImages();
      } else {
        toast(res.message || '删除失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.verifyImage = function(id) {
    toast('正在验证镜像...', 'info');
    api('/images/' + id + '/verify', { method: 'POST' }).then(function(res) {
      if (res.code === 0) {
        toast('验证完成: ' + (res.message || '镜像文件正常'), 'success');
        loadImages();
      } else {
        toast(res.message || '验证失败', 'error');
      }
    }).catch(function(err) {
      toast('验证请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.convertImage = function(id) {
    if (!confirm('确定要转换该镜像格式吗？')) return;
    toast('正在提交转换任务...', 'info');
    api('/images/' + id + '/convert', { method: 'POST' }).then(function(res) {
      if (res.code === 0) {
        toast('转换任务已提交', 'success');
        loadImages();
      } else {
        toast(res.message || '转换失败', 'error');
      }
    }).catch(function(err) {
      toast('转换请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.viewDetail = function(id) {
    toast('正在加载详情...', 'info');
    api('/images/' + id).then(function(res) {
      if (res.code !== 0) {
        toast(res.message || '获取详情失败', 'error');
        return;
      }
      var item = res.data;
      var content = '';
      content += '<div class="detail-grid">';
      content += '<div class="detail-item"><div class="dt-label">ID</div><div class="dt-value">' + esc(item.id) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">名称</div><div class="dt-value">' + esc(item.name) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">文件名</div><div class="dt-value">' + esc(item.filename || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">格式</div><div class="dt-value">' + esc(item.format) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">文件大小</div><div class="dt-value">' + fmtSize(item.file_size) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">SHA256</div><div class="dt-value" style="font-size:11px;font-family:monospace;">' + esc(item.sha256 || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">系统类型</div><div class="dt-value">' + esc(item.os_type || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">系统版本</div><div class="dt-value">' + esc(item.os_version || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">系统架构</div><div class="dt-value">' + esc(item.os_arch || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">状态</div><div class="dt-value">' + statusBadge(item.status, item.status === 'enabled' ? '启用' : '禁用') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">镜像源ID</div><div class="dt-value">' + (item.source_id || '-') + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">创建时间</div><div class="dt-value">' + fmtDate(item.created_at) + '</div></div>';
      content += '<div class="detail-item"><div class="dt-label">更新时间</div><div class="dt-value">' + fmtDate(item.updated_at) + '</div></div>';
      if (item.description) {
        content += '<div class="detail-item detail-full"><div class="dt-label">描述</div><div class="dt-value">' + esc(item.description) + '</div></div>';
      }
      content += '</div>';
      content += '<div class="form-actions" style="margin-top:16px;">';
      content += '<button class="btn-cancel" onclick="closeModal()">关闭</button>';
      content += '<button class="action-btn edit" style="padding:8px 20px;font-size:13px;" onclick="closeModal();showEditModal(\'' + item.id + '\')">编辑</button>';
      content += '<button class="action-btn run" style="padding:8px 20px;font-size:13px;" onclick="closeModal();verifyImage(\'' + item.id + '\')">验证</button>';
      content += '<button class="action-btn more" style="padding:8px 20px;font-size:13px;background:#fff7ed;color:#ea580c;" onclick="closeModal();convertImage(\'' + item.id + '\')">转换格式</button>';
      content += '</div>';

      showModal('镜像详情 - ' + esc(item.name), content);
    }).catch(function(err) {
      toast('获取详情失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.batchDelete = function() {
    if (selectedIds.length === 0) { toast('请先选择镜像', 'error'); return; }
    if (!confirm('确定要删除选中的 ' + selectedIds.length + ' 个镜像吗？此操作不可恢复。')) return;
    api('/images/batchDelete', { method: 'POST', body: { ids: selectedIds } }).then(function(res) {
      if (res.code === 0) {
        toast('批量删除成功', 'success');
        selectedIds = [];
        loadImages();
      } else {
        toast(res.message || '批量删除失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  window.showUploadModal = function() {
    var content = '';
    content += '<div class="upload-area" id="uploadArea" onclick="document.getElementById(\'fileInput\').click()">';
    content += '<div class="icon">📁</div>';
    content += '<div class="text">点击选择文件或拖拽文件到此处</div>';
    content += '<div class="hint">支持 WIM / ISO / GHO / ESD 格式</div>';
    content += '</div>';
    content += '<input type="file" id="fileInput" accept=".wim,.iso,.gho,.esd" style="display:none;" onchange="onFileSelected(this)">';
    content += '<div id="fileInfo" style="display:none;margin-bottom:12px;">';
    content += '<div style="padding:10px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;font-size:13px;color:#16a34a;">';
    content += '已选择: <strong id="fileName"></strong> (<span id="fileSize"></span>)</div></div>';
    content += '<div class="upload-progress" id="uploadProgress">';
    content += '<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>';
    content += '<div class="progress-text" id="progressText">准备上传...</div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>镜像名称 <span style="color:#dc2626;">*</span></label><input type="text" id="uploadName" placeholder="上传后自动填入"></div>';
    content += '<div class="form-group"><label>格式</label><select id="uploadFormat"><option value="">自动识别</option><option value="wim">WIM</option><option value="iso">ISO</option><option value="gho">GHO</option><option value="esd">ESD</option></select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>描述</label><textarea id="uploadDescription" rows="2" placeholder="可选描述"></textarea></div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" id="uploadBtn" onclick="startUpload()" disabled>上传</button>';
    content += '</div>';

    showModal('上传镜像文件', content);
  };

  window.onFileSelected = function(input) {
    var file = input.files[0];
    if (!file) return;
    document.getElementById('fileInfo').style.display = 'block';
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileSize').textContent = fmtSize(file.size);
    document.getElementById('uploadBtn').disabled = false;
    var nameInput = document.getElementById('uploadName');
    if (!nameInput.value.trim()) {
      nameInput.value = file.name.replace(/\.[^/.]+$/, '');
    }
    var ext = file.name.split('.').pop().toLowerCase();
    var formatSelect = document.getElementById('uploadFormat');
    if (['wim', 'iso', 'gho', 'esd'].indexOf(ext) !== -1) {
      formatSelect.value = ext;
    }
  };

  window.startUpload = function() {
    var fileInput = document.getElementById('fileInput');
    var file = fileInput.files[0];
    if (!file) { toast('请先选择文件', 'error'); return; }

    var name = document.getElementById('uploadName').value.trim();
    var format = document.getElementById('uploadFormat').value;
    var description = document.getElementById('uploadDescription').value.trim();

    if (!name) { toast('请输入镜像名称', 'error'); return; }

    var progressDiv = document.getElementById('uploadProgress');
    progressDiv.style.display = 'block';
    document.getElementById('uploadBtn').disabled = true;

    var formData = new FormData();
    formData.append('file', file);
    formData.append('name', name);
    formData.append('description', description);
    if (format) formData.append('format', format);

    var token = localStorage.getItem(TOKEN_KEY);
    var xhr = new XMLHttpRequest();

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = Math.round((e.loaded / e.total) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = '上传中 ' + pct + '% (' + fmtSize(e.loaded) + ' / ' + fmtSize(e.total) + ')';
      }
    };

    xhr.onload = function() {
      document.getElementById('uploadBtn').disabled = false;
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var res = JSON.parse(xhr.responseText);
          if (res.code === 0) {
            toast('上传成功', 'success');
            closeModal();
            loadImages();
          } else {
            toast(res.message || '上传失败', 'error');
          }
        } catch (e) {
          toast('上传响应解析失败', 'error');
        }
      } else {
        toast('上传失败 (HTTP ' + xhr.status + ')', 'error');
      }
    };

    xhr.onerror = function() {
      document.getElementById('uploadBtn').disabled = false;
      toast('上传网络错误', 'error');
    };

    xhr.open('POST', '/api/v1/images/upload', true);
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.send(formData);
  };

  window.showRemoteUrlModal = function() {
    var content = '';
    content += '<div class="form-group"><label>远程URL <span style="color:#dc2626;">*</span></label>';
    content += '<input type="url" id="remoteUrl" placeholder="https://example.com/images/win11.iso">';
    content += '<div style="font-size:12px;color:#94a3b8;margin-top:4px;">支持 HTTP/HTTPS 协议的远程文件地址</div></div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>镜像名称 <span style="color:#dc2626;">*</span></label><input type="text" id="remoteName" placeholder="镜像名称"></div>';
    content += '<div class="form-group"><label>格式</label><select id="remoteFormat"><option value="">自动识别</option><option value="wim">WIM</option><option value="iso">ISO</option><option value="gho">GHO</option><option value="esd">ESD</option></select></div>';
    content += '</div>';
    content += '<div class="form-group"><label>描述</label><textarea id="remoteDescription" rows="2" placeholder="可选描述"></textarea></div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>系统类型</label><input type="text" id="remoteOsType" placeholder="如: Windows"></div>';
    content += '<div class="form-group"><label>系统版本</label><input type="text" id="remoteOsVersion" placeholder="如: 11 Pro"></div>';
    content += '</div>';
    content += '<div class="form-row">';
    content += '<div class="form-group"><label>系统架构</label><select id="remoteOsArch"><option value="">请选择</option><option value="x64">x64</option><option value="x86">x86</option><option value="arm64">arm64</option></select></div>';
    content += '<div class="form-group"><label>状态</label><select id="remoteStatus"><option value="enabled">启用</option><option value="disabled">禁用</option></select></div>';
    content += '</div>';
    content += '<div class="form-actions">';
    content += '<button class="btn-cancel" onclick="closeModal()">取消</button>';
    content += '<button class="btn-submit" onclick="submitRemoteUrl()">导入</button>';
    content += '</div>';

    showModal('远程导入镜像', content);
  };

  window.submitRemoteUrl = function() {
    var url = document.getElementById('remoteUrl').value.trim();
    var name = document.getElementById('remoteName').value.trim();
    var format = document.getElementById('remoteFormat').value;
    var description = document.getElementById('remoteDescription').value.trim();
    var osType = document.getElementById('remoteOsType').value.trim();
    var osVersion = document.getElementById('remoteOsVersion').value.trim();
    var osArch = document.getElementById('remoteOsArch').value;
    var status = document.getElementById('remoteStatus').value;

    if (!url) { toast('请输入远程URL', 'error'); return; }
    if (!name) { toast('请输入镜像名称', 'error'); return; }

    var body = {
      url: url,
      name: name,
      description: description,
      format: format || undefined,
      os_type: osType || undefined,
      os_version: osVersion || undefined,
      os_arch: osArch || undefined,
      status: status
    };

    api('/images/addRemoteUrl', { method: 'POST', body: body }).then(function(res) {
      if (res.code === 0) {
        toast('远程导入任务已创建', 'success');
        closeModal();
        loadImages();
      } else {
        toast(res.message || '导入失败', 'error');
      }
    }).catch(function(err) {
      toast('网络请求失败: ' + (err.message || '未知错误'), 'error');
    });
  };

  loadImages();

})();
</script>
